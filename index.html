var EXTRA = {
"p1-what-is-seo":{s:"Imagine a huge library where people ask the librarian for the best book on a subject. SEO is the work of making your page the book the librarian recommends first.",t:"Search “best pizza near me” on Google. Notice which results are marked Ad and which are normal. The normal ones are what SEO tries to win."},
"p1-crawling":{s:"Googlebot is like a delivery person who walks every street of a city by following the roads. Links are the roads. A page with no road leading to it may never be visited.",t:"Type your site address followed by /robots.txt into your browser (for example yoursite.com/robots.txt) and read what it says."},
"p1-indexing":{s:"After visiting a house, the delivery person decides whether to add it to the city's address book. Only houses in the address book can be found by people asking for directions. That address book is the index.",t:"In Google, search site:yourwebsite.com. The results roughly show the pages Google has indexed."},
"p1-ranking":{s:"Think of a race judged by a panel. Google compares every page that could answer a question and puts the most helpful one first. Nobody knows all the judges' rules, but they reward pages that truly help.",t:"Search one keyword and write down the top 3 results. Ask yourself why Google placed these first."},
"p1-serp":{s:"The SERP is the shop window you see after searching. It shows more than products (blue links): there are also ads, maps, videos and quick answers.",t:"Search “how to tie a tie” and then “plumber near me”. Compare the two result pages and list the different features you see."},
"p1-seo-types":{s:"Think of a restaurant. Technical SEO is the building and kitchen working properly. On-page SEO is a good menu. Content is what dishes you choose to cook. Off-page SEO is other people recommending you.",t:"Take any website and write one improvement idea for each of the four areas.",
 terms:[["Technical SEO","The building: can Google enter, read the pages and load them quickly?"],["On-page SEO","The menu: titles, headings, text and images on each page."],["Content","What you choose to cook: which topics you cover and how well."],["Off-page SEO","The reputation: links and mentions from other sites."]]},
"p1-search-intent":{s:"Intent is what is in the person's head. Someone typing “pizza” might want a recipe, a nearby restaurant or to order now. Google guesses what most people want and shows that.",t:"Search “buy running shoes” and then “how to choose running shoes”. Notice the first shows shops and the second shows articles. That difference is intent.",
 terms:[["Informational","Wants to learn. Example: how to tie a tie."],["Navigational","Wants to reach a particular site. Example: Facebook login."],["Commercial","Is comparing before buying. Example: best laptops under 50000."],["Transactional","Is ready to buy or act. Example: buy iPhone online."]]},
"p1-helpful-content":{s:"It works like choosing a doctor: you trust one with real experience, solid qualifications, a good reputation and honesty. Google looks for the same signs on websites.",t:"Open a blog you like. Find the author's name, their background and any sources. Does it feel trustworthy, and why?",
 terms:[["Experience","Have you really done it? For example, a review from someone who used the product."],["Expertise","Do you know the subject deeply? For example, a doctor writing about health."],["Authoritativeness","Do others in the field recognise you? For example, experts quote or link to you."],["Trust","Is the information accurate and the site honest and safe? Clear contact details and a secure site help."]]},
"p1-spam-policies":{s:"These are the rules of the game. Cheating, like copying essays or buying fake votes, may work for a while but eventually gets you disqualified.",t:"Search for Google's “spam policies” page and read just the list of headings to see what is banned."},
"p1-algorithm-updates":{s:"Google keeps improving its judging rules, like a teacher updating the marking scheme. Sites that were truly helpful usually keep their marks.",t:"Search “Google Search Status Dashboard” and look at the latest update listed."},

"p2-gsc-setup":{s:"Search Console is a free report card from Google about your website: who found it, what they searched for and what is broken.",t:"Go to Search Console, add your site and verify it. Data appears after a few days."},
"p2-gsc-performance":{s:"This report is the footfall report for your shop window: how many people saw your result, how many came in, and where you stood in the line-up.",t:"Open Performance, set the last 3 months, click Queries and sort by impressions. Write down the top 5.",
 terms:[["Clicks","People who clicked your result and came to your site."],["Impressions","Times your result was shown, even if nobody clicked. Like people walking past your window."],["CTR","Of everyone who saw your result, the share who clicked. 5 clicks from 100 impressions is 5%."],["Average position","Where you usually appear. 1 is the very top. Around 8 is near the bottom of page 1."]]},
"p2-gsc-indexing":{s:"This shows which of your pages made it into Google's address book, and gives reasons for the ones that did not.",t:"Open the Pages (indexing) report, compare Indexed with Not indexed, click one reason and read the example URLs."},
"p2-ga4-basics":{s:"If Search Console shows how people reach your shop door, GA4 shows what they do once they are inside.",t:"Open GA4, go to Reports, Acquisition, Traffic acquisition, find the Organic Search row and note its sessions.",
 terms:[["Users","Different people who visited."],["Sessions","Visits. One person visiting twice makes 2 sessions."],["Engagement rate","The share of visits where the person did something: stayed over 10 seconds, viewed 2 or more pages or completed a goal."]]},
"p2-ga4-conversions":{s:"A conversion is the moment a browser becomes a customer: a call, a form, a purchase. Tracking it proves SEO brings real business.",t:"List 3 actions on your site that matter (call, form, booking). Ask which ones are already tracked."},
"p2-screaming-frog":{s:"It is a robot inspector that walks through every page of your site and hands you a checklist of problems.",t:"Download it, enter your site address and press Start. Then open the Response Codes tab and filter for Client Error (4xx) to see broken pages."},
"p2-pagespeed":{s:"A free health check for a page. It tests speed on a phone and tells you what to fix.",t:"Paste your homepage into PageSpeed Insights, switch to Mobile and note the three Core Web Vitals results."},
"p2-keyword-tools":{s:"Keyword tools are like a market survey: they estimate how many people search for something and how competitive it is. The numbers are estimates, not exact counts.",t:"Type one topic into Google Keyword Planner or Ubersuggest and note volume and difficulty for 5 related phrases."},
"p2-reporting-tools":{s:"A dashboard is like a car's dashboard: a few key dials in one place that update by themselves.",t:"Sketch a one-page report on paper with 5 numbers and one sentence on what to do next."},

"p3-keyword-types":{s:"“Shoes” is a crowded high street. “Waterproof trail running shoes for women size 6” is a small specialist shop with fewer visitors who are far more likely to buy.",t:"Pick a product or service and write 1 short-tail and 5 long-tail versions of its keyword.",
 terms:[["Short-tail","Short, broad searches such as “shoes”. Many searches but unclear intent and strong competition."],["Long-tail","Longer, specific searches. Fewer searches but clear intent and easier to win."],["Primary keyword","The main phrase one page is built around."],["Secondary keywords","Related phrases the same page can also rank for."]]},
"p3-keyword-metrics":{s:"These numbers are like a shop's footfall, competition and rent. They help you choose a location but they are not the whole story.",t:"Take 5 keywords, look them up in a tool and rank them by how well they fit your business, not by volume.",
 terms:[["Search volume","Roughly how many people search it each month, like footfall on a street."],["Keyword difficulty","How tough the competition is, like how many strong rivals are in the race."],["CPC","What advertisers pay per click. A high number often means customers there are valuable."],["Traffic potential","The total visits the top page for that topic gets. Often more useful than volume."]]},
"p3-keyword-process":{s:"Start by listening. Write down what your customers ask, then use tools to see how many others ask the same thing.",t:"Write 10 questions your customers ask. Type each into Google and note the People Also Ask suggestions."},
"p3-keyword-mapping":{s:"Give each group of related keywords its own page, like giving each product its own shelf. If two shelves hold the same product, shoppers and Google get confused.",t:"Make a sheet with columns for keyword, page and intent. Assign 10 keywords to pages."},
"p3-competitor-research":{s:"Check who is already standing on the podium, study what they do, then do it better.",t:"Search 3 of your keywords, list the sites that appear in all three and open their best page."},
"p3-topic-clusters":{s:"Like a book: one main chapter (the pillar) explains the subject and smaller chapters (cluster pages) go deeper. Links connect the chapters.",t:"Choose a topic and sketch one pillar title and five supporting page titles."},
"p3-content-gap":{s:"A gap is a question your customers ask that nobody on your site answers yet.",t:"Search your main topic, scroll to People Also Ask and check which questions your site does not answer."},
"p3-content-writing":{s:"A brief is a recipe card for the writer, so the dish comes out right the first time.",t:"Write a brief for one article: keyword, who it is for, 5 headings and 3 questions to answer."},
"p3-content-refresh":{s:"Like repainting a shop that already has footfall. It is cheaper than building a new one.",t:"In Search Console, find a page whose clicks fell this quarter and list 3 things to update."},

"p4-title-tags":{s:"It is the headline on your shop sign in the search results. It decides whether people walk in.",t:"Search your brand name and read your title in the results. Rewrite it in under 60 characters with the main keyword first."},
"p4-meta-descriptions":{s:"The small line of text under the sign explaining what is inside. It persuades people to click but does not rank you directly.",t:"Write a 150-character description for your homepage that gives a clear reason to click."},
"p4-headings":{s:"Headings are like chapter titles. Reading only the headings should tell you the whole story.",t:"Open a page, list its H1 and H2s and check they read like a clear outline."},
"p4-urls":{s:"The URL is the page's street address. Short and readable beats long and confusing.",t:"Rewrite yoursite.com/?p=123 as a clean address using the main keyword."},
"p4-keyword-placement":{s:"Mention the topic where a reader would expect it, such as the heading and the opening, and use natural variations. Do not repeat it like a parrot.",t:"Read your page aloud. Wherever the keyword sounds forced, rewrite the sentence."},
"p4-internal-linking":{s:"Internal links are signposts between rooms of your shop. They guide visitors and show Google which rooms matter.",t:"Pick a new page and add 3 links to it from older, related pages using descriptive words."},
"p4-image-seo":{s:"Alt text is what a screen reader says out loud instead of the picture. It helps blind visitors and helps Google understand the image.",t:"Open a page's images and write alt text for each as if describing it over the phone."},
"p4-on-page-content":{s:"Check what the top pages cover, then make yours the clearest and most complete answer.",t:"Open the top 3 results for your keyword, list their common headings and see which ones your page lacks."},

"p5-site-architecture":{s:"Think of a well-planned shopping centre with clear floors and signs, so no shop is more than a few steps away.",t:"Draw your site's menu as a tree. Check that every important page is within 3 clicks of the homepage."},
"p5-sitemaps":{s:"A sitemap is a map you hand to Google that says: here are the pages I want you to see.",t:"Open yoursite.com/sitemap_index.xml (or /sitemap.xml) and check that it loads."},
"p5-robots":{s:"robots.txt is a sign at the door telling robots which rooms not to enter. noindex is a sign inside a room saying “do not list this room in the directory”.",t:"Open yoursite.com/robots.txt and look for a line that says Disallow: / on its own. On a live site that blocks everything, so ask for help if you see it."},
"p5-status-codes":{s:"Every time a page is requested, the server replies with a number saying what happened.",t:"Type a made-up address on your site (yoursite.com/abc123) and check that you get a proper “page not found” page.",
 terms:[["200","All good. The page loaded normally."],["301","This page moved for good. Visitors and Google are sent to the new address, like a forwarding note on a shop door."],["302","Moved for now only. It may come back."],["404","Page not found, like knocking at an address where no shop exists."],["410","Gone on purpose and will not come back."],["5xx (500, 503)","The server itself broke or is overloaded."]]},
"p5-redirects":{s:"Like a postal forwarding service: when a shop moves, mail sent to the old address still reaches the new one.",t:"In Screaming Frog, open the Redirection (3xx) filter and look for chains with more than one hop."},
"p5-duplicates":{s:"If the same book sits on three shelves with different labels, the librarian does not know which to recommend. A canonical tag says: this is the real one.",t:"Type your site with and without www, and with http and https. All four should end up at one version."},
"p5-mobile-js":{s:"Most people use phones, so Google judges your site as seen on a phone. JavaScript is code that builds parts of a page after loading. If Google cannot run it, that content may be missing.",t:"Open your site on your phone. Can you read, tap and scroll comfortably? Then check the page in Search Console's URL Inspection."},
"p5-schema":{s:"Schema is a label sticker on your content: “this is a phone number, this is a price”. It helps machines read your page without guessing.",t:"Paste a page address into Google's Rich Results Test and see which labels it finds."},
"p5-core-web-vitals":{s:"Three quick checks of a page visit: does it appear quickly, react quickly and stay still?",t:"Run PageSpeed Insights on your homepage and note the three scores. Good means LCP 2.5 seconds or less, INP 200 milliseconds or less and CLS 0.1 or less.",
 terms:[["LCP (Largest Contentful Paint)","How long you wait before you can see the main thing on the page, usually the top image or heading. Like staring at an empty room after opening the shop door. Good: 2.5 seconds or less."],["INP (Interaction to Next Paint)","How quickly the page reacts when you tap or click. Like pressing a lift button and counting how long before it responds. Good: 200 milliseconds or less."],["CLS (Cumulative Layout Shift)","How much the page jumps around while loading. Like shelves being moved just as you reach for an item. Good: 0.1 or less. This is a score, not a time."]]},
"p5-speed-fixes":{s:"Speeding up a page is like packing lighter for a trip: smaller images, fewer extras and a faster vehicle (your hosting).",t:"Compress your three largest images and test the page again to see the change."},

"p6-backlinks":{s:"A backlink is another website saying “this is worth visiting.” A recommendation from a respected doctor counts for more than one from a stranger.",t:"Use a free backlink checker on your site and write down the top 3 sites linking to you."},
"p6-link-quality":{s:"Quality beats quantity, and relevance counts. A link from a cooking blog to a recipe page is natural. A link from an unrelated gambling site is not.",t:"Open one site that links to you and ask: is it real, relevant and something I am proud of?"},
"p6-link-building":{s:"Earn links the way a shop earns word of mouth: by being genuinely worth talking about.",t:"List 5 useful things you could create (a guide, checklist, tool or survey) that others might link to."},
"p6-brand-mentions":{s:"Even when no link is given, being talked about makes your brand familiar and trusted.",t:"Search your brand name in quotes and note the mentions that have no link. These are people to politely ask."},
"p6-link-spam":{s:"Paid or fake links are like buying fake reviews. Google can often spot them and ignores or punishes them.",t:"Review your backlink list for anything odd (unrelated, foreign, gambling) and note it down."},
"p6-local-seo":{s:"Local SEO helps you appear when someone nearby searches “dentist near me”, like being listed on the local street signboard.",t:"Search “[your service] near me” on your phone and notice the three businesses shown on the map."},
"p6-gbp":{s:"It is your free business card on Google Maps, with opening hours, photos and reviews.",t:"Search your business on Google. If the panel is not claimed, look for “Own this business?” and start verification."},
"p6-nap-citations":{s:"Your business name, address and phone number should look identical everywhere, like a signature that always matches.",t:"Check 5 directories where you are listed and see whether the name, address and phone match exactly."},
"p6-reviews":{s:"Reviews are word of mouth that anyone can read. More recent, real reviews mean more trust and more clicks.",t:"Write a 2-line message asking happy customers for a review, with your review link."},
"p6-local-pages":{s:"If you have branches in several towns, each branch gets its own proper page with its own address and photos, not copies of one page.",t:"For one location, list what makes its page unique: address, map, photos, reviews and team."},

"p7-ai-overviews":{s:"Google sometimes writes a short answer itself and lists the sources it used. You want your page to be one of those sources.",t:"Search a question in your field and see whether an AI answer appears and which sites it cites."},
"p7-geo-aeo":{s:"It is the same idea as SEO but for chatbots: make your content easy for ChatGPT or Gemini to quote correctly.",t:"Ask ChatGPT or Gemini a question in your niche and note which sites it mentions."},
"p7-entity-seo":{s:"An entity is a clearly identified thing. Make it obvious to machines that your business is one specific, real company, like wearing a name badge.",t:"Search your brand name. Does Google show a clear information panel? Note what is missing."},
"p7-migrations":{s:"Moving a website is like moving house: tell everyone the new address, forward the post and check nothing gets lost.",t:"Practise by writing a table of 10 old URLs and their new equivalents."},
"p7-traffic-drops":{s:"Be like a doctor: check the basics first (is it real, when did it start, which pages?) before prescribing a cure.",t:"In Search Console compare the last 28 days with the previous 28 and find which pages lost the most clicks."},
"p7-international":{s:"Selling in several countries means a separate shop front per language, with tags telling Google which is for whom.",t:"List which countries and languages you want and decide the URL structure (for example /fr/ for French)."},
"p7-programmatic":{s:"A template stamped many times, like a form letter. It is good when each copy carries real, unique information and bad when only the names are swapped.",t:"Imagine a template with real data, such as prices by city. Would each page be genuinely useful?"},
"p7-ecommerce":{s:"In a shop, category pages are the aisles and product pages are the items. Most shoppers search for the aisle first.",t:"Pick an online store and note its main categories. Which ones would people search for?"},
"p7-audit-process":{s:"An audit is a health check-up followed by a treatment plan, ordered by what matters most.",t:"Do a mini-audit of a small site: check indexing, titles, speed and mobile, then rank your findings by impact."},
"p7-seo-reporting":{s:"A monthly report answers three questions: what happened, why, and what we do next.",t:"Write a three-sentence summary of your practice site's last month."}
};

/* Show me how: steps per topic. Use "all" when the steps are the same everywhere, otherwise wp, sh, wix, code. */
var PLATFORMS = [["wp","WordPress"],["sh","Shopify"],["wix","Wix"],["code","Custom code"]];

var HOW = {
"p1-crawling":{all:["Open `yoursite.com/robots.txt` in your browser. This file tells crawlers what to skip.","Open `yoursite.com/sitemap.xml` (or `/sitemap_index.xml`). This file lists the pages you want found.","In Search Console, open Settings, then Crawl stats, to see how often Google visits."],tools:["gsc","screamingfrog"]},
"p1-indexing":{all:["Open Search Console and paste a page address into the top bar. This is the URL Inspection tool.","Read the result. “URL is on Google” means indexed. “URL is not on Google” tells you why not.","For a new or updated page, click Request indexing. It asks Google to look again and is not a guarantee.","Open the Pages report to see every indexed and not-indexed page in one list."],tools:["gsc","bing"]},
"p1-serp":{all:["Search your keyword in a private (incognito) window so results are not personalised.","Note what appears: ads, map pack, videos, People Also Ask, an AI answer.","Write down the format of the top 3 results (guide, list, product page, tool)."],tools:[]},
"p1-search-intent":{all:["Search your keyword and open the top 3 results.","Ask what each page is: a guide, a list, a shop page or a tool.","Decide the intent: learn, find a site, compare or buy.","Plan your page in the same format."],tools:[]},
"p1-helpful-content":{all:["Add the author's name and a short bio to articles.","Link to the sources you used.","Show a real address, phone number or email, and an About page.","Add original photos, examples or data from your own work."],tools:[]},
"p1-algorithm-updates":{all:["Bookmark the Google Search Status Dashboard.","When an update is announced, note its start and end dates in a sheet.","Once the rollout ends, compare Search Console clicks before and after.","Only then decide what to improve."],tools:["gsc"]},

"p2-gsc-setup":{
 wp:["Install the free Google Site Kit plugin.","Follow its Sign in with Google steps. It verifies the site for you.","Open Search Console to confirm your site appears.","Submit your sitemap under Sitemaps."],
 sh:["In Search Console, add a Domain property and copy the DNS TXT record it shows.","Add that TXT record where your domain's DNS is managed (your domain provider, or Shopify Domains if you bought it there).","Back in Search Console, click Verify.","Submit `yourstore.com/sitemap.xml` under Sitemaps."],
 wix:["In your Wix dashboard, open Marketing & SEO, then Marketing integrations, and connect Google Search Console.","Follow the prompts to verify your site.","Wix creates the sitemap for you, so submit it if asked."],
 code:["Add a Domain property in Search Console and add the DNS TXT record at your domain provider. This is the best method.","Alternatively, with a URL-prefix property, paste the HTML meta tag Search Console gives you inside the `<head>` of your homepage.","Click Verify, then submit your `sitemap.xml`."],
 tools:["gsc","sitekit","bing"]},
"p2-gsc-performance":{all:["Open Search Console, then Performance, then Search results.","Set the date range to the last 3 months.","Click Queries to see the search words. Click Pages to see which pages bring traffic.","Use Compare to set this period against the previous one."],tools:["gsc","lookerstudio"]},
"p2-gsc-indexing":{all:["Open Search Console and go to Indexing, then Pages.","Compare the Indexed and Not indexed totals.","Click each reason under Not indexed and read the example URLs.","Fix real problems (errors, blocked pages), then click Validate fix."],tools:["gsc"]},
"p2-ga4-basics":{
 wp:["Install Google Site Kit and connect Google Analytics, or paste the Google tag into your theme using a header-scripts plugin.","Visit your site, then check the Realtime report in GA4 to confirm your visit appears."],
 sh:["In the Shopify admin, add the free Google & YouTube app.","Connect your Google account and choose your GA4 property.","Visit your store and confirm the visit in GA4 Realtime."],
 wix:["In Wix, open Marketing & SEO, then Marketing integrations, and connect Google Analytics.","Paste your GA4 Measurement ID (it starts with G-).","Visit your site and check GA4 Realtime."],
 code:["In GA4, create a property and a Web data stream, then copy the Measurement ID (G-XXXXXXX).","Paste the Google tag snippet just after the opening `<head>` tag on every page, or load it through Google Tag Manager.","Visit your site and check the Realtime report."],
 tools:["ga4","gtm","sitekit"]},
"p2-ga4-conversions":{all:["In GA4, open Admin and find Events.","Find the action you care about, such as `generate_lead` or `purchase`.","Turn on Mark as key event for it.","If the action has no event yet (for example a click on your phone number), create one with Google Tag Manager.","After a day, check Reports, Engagement, Events for the counts."],tools:["ga4","gtm"]},
"p2-screaming-frog":{all:["Download the SEO Spider from the Screaming Frog website (Windows, Mac and Linux).","Type your site address at the top and click Start.","When it finishes, open the tabs: Response Codes (errors), Page Titles, Meta Description, H1 and Images.","Use Export to save a tab as a spreadsheet, then sort by problem."],tools:["screamingfrog"]},
"p2-pagespeed":{all:["Open PageSpeed Insights (`pagespeed.web.dev`) and paste a page address.","Switch between Mobile and Desktop at the top. Focus on Mobile.","Read the real-visitor results at the top first, then Opportunities and Diagnostics below.","Test again after each change."],tools:["psi"]},
"p2-keyword-tools":{all:["Open Google Keyword Planner (it needs a free Google Ads account) or Ubersuggest.","Enter your topic and note the volume and difficulty of each phrase.","Copy the list into a spreadsheet with extra columns for intent and target page."],tools:["keywordplanner","trends","ubersuggest","ahrefs","semrush"]},
"p2-reporting-tools":{all:["Open Looker Studio and create a blank report.","Add Search Console and GA4 as data sources.","Add scorecards for clicks, impressions, organic sessions and conversions.","Add a date comparison and schedule the report to be emailed to you."],tools:["lookerstudio","gsc","ga4"]},

"p3-keyword-process":{all:["Write 10 to 20 questions your customers ask in a sheet.","Put each one into a keyword tool to get volume and related ideas.","Search each one on Google and note the intent from the results.","Add the queries Search Console already shows for your site."],tools:["keywordplanner","ubersuggest","trends","gsc"]},
"p3-keyword-mapping":{all:["Create a sheet with the columns: Keyword, Volume, Intent, Target page, Status.","Group keywords that the same pages rank for.","Give each page one primary keyword.","Mark missing pages as To create."],tools:["sheets"]},
"p3-competitor-research":{all:["Search your top keyword and note the domains that keep appearing.","In Ubersuggest, Ahrefs or Semrush, enter one competitor and open its top pages.","Note the page types, length and headings.","Write down one thing you can do better."],tools:["ubersuggest","ahrefs","semrush"]},
"p3-topic-clusters":{all:["Choose one broad topic for the pillar page.","List 5 to 8 related questions as cluster pages.","Link every cluster page to the pillar, and the pillar to every cluster page.","Add links between related cluster pages."],tools:["sheets"]},
"p3-content-gap":{all:["In Ahrefs or Semrush, use Content gap with 2 or 3 competitors. Free accounts show limited data.","Or search each topic and read the People Also Ask questions.","List the topics competitors rank for and you do not."],tools:["ahrefs","semrush","ubersuggest"]},
"p3-content-writing":{all:["Write a brief first: keyword, reader, intent and a list of headings.","Add 3 to 5 questions the page must answer.","List the internal links and sources to include.","After writing, check facts and add one original example."],tools:["sheets"]},
"p3-content-refresh":{all:["In Search Console, compare the last 3 months with the same period a year ago.","Sort pages by clicks lost.","Update facts, add missing sections and improve the title. Keep the same URL.","Request indexing in URL Inspection."],tools:["gsc"]},

"p4-title-tags":{
 wp:["Open the page or post in the editor.","Scroll to the Yoast SEO or Rank Math box under the content.","Edit the SEO title. The Google preview updates as you type.","Click Update."],
 sh:["Open the page, product or collection.","Scroll to Search engine listing and click Edit.","Change the Page title and click Save."],
 wix:["Open Pages & Menu and click the three dots next to the page.","Choose SEO basics.","Edit the Title tag and save."],
 code:["Open the page's HTML file.","Edit the title inside the `<head>`: `<title>Best Running Shoes for Flat Feet | YourBrand</title>`","Give every page its own title. In a framework such as Next.js, set it in each page's metadata."],
 tools:["yoast","rankmath","screamingfrog"]},
"p4-meta-descriptions":{
 wp:["Open the page or post in the editor.","In the Yoast SEO or Rank Math box, find Meta description.","Write about 150 to 160 characters with a reason to click.","Click Update."],
 sh:["Open the page, product or collection.","Under Search engine listing, click Edit.","Fill in the Meta description and click Save."],
 wix:["Open Pages & Menu, click the three dots next to the page and choose SEO basics.","Fill in the Meta description and save."],
 code:["Add this inside the `<head>`: `<meta name=\"description\" content=\"Short summary with a reason to click.\">`","Use a different description on every page."],
 tools:["yoast","rankmath","screamingfrog"]},
"p4-headings":{
 wp:["Click a heading block in the editor.","Choose H2 or H3 for sections. The post title is usually the H1 already.","Change the look in the design settings, not by picking a different heading level."],
 sh:["Edit the page and use the paragraph style dropdown to pick Heading 2 or Heading 3.","Most themes already make the page title the H1, so start sections at Heading 2."],
 wix:["Click the text, open Edit text and set its heading tag (H1, H2 or H3).","Keep one H1 per page and make it the main title."],
 code:["Use one `<h1>` for the main title.","Use `<h2>` for sections and `<h3>` for subsections.","Style them with CSS, not by changing the tag."],
 tools:["screamingfrog"]},
"p4-urls":{
 wp:["Go to Settings, then Permalinks, and choose Post name.","Edit a page's slug in its settings panel (the URL field).","If you change a live URL, add a 301 redirect."],
 sh:["Open the page or product, then Search engine listing, then Edit, then URL handle.","Tick Create a URL redirect so the old address still works."],
 wix:["Open Pages & Menu, click the three dots next to the page, then SEO basics, then URL slug.","Wix usually offers to set up a redirect when you change a live slug."],
 code:["Name files and folders with lowercase words and hyphens, such as `/best-running-shoes/`.","In a framework, use the same pattern for routes.","Add a redirect for any URL you rename."],
 tools:["screamingfrog"]},
"p4-keyword-placement":{all:["Open the page and check the title, H1, first paragraph, one subheading and the URL.","Add the keyword where it reads naturally and use variations elsewhere.","Read the page aloud and rewrite any forced sentence."],tools:["yoast","rankmath"]},
"p4-internal-linking":{
 wp:["Select the words in the editor and press the link button (or Ctrl/Cmd+K).","Search for the page you want to link to and pick it.","Yoast Premium and Rank Math also suggest related links as you write."],
 sh:["In a page, blog post or product description, select text and click the link icon.","Choose one of your pages or paste its address."],
 wix:["Select text and click the link icon in the text toolbar.","Choose Page and pick the destination."],
 code:["Use descriptive link text: `<a href=\"/seo-guide/\">our SEO guide</a>`","Avoid “click here” as the link text."],
 tools:["screamingfrog","yoast","rankmath"]},
"p4-image-seo":{
 wp:["Open the Media Library, click an image and fill in Alt text.","Rename files before uploading, for example `red-running-shoes.jpg`.","Use ShortPixel, Imagify or Smush to compress and convert images to WebP."],
 sh:["Open the product, click the image and choose Edit alt text.","Upload compressed files. Shopify serves modern image formats automatically."],
 wix:["Click an image, open Settings and fill in the alt text field.","Wix compresses images and serves modern formats automatically."],
 code:["Add alt text and size to every image: `<img src=\"red-running-shoes.webp\" alt=\"Red trail running shoes on a rocky path\" width=\"800\" height=\"600\">`","Add `loading=\"lazy\"` to images below the fold, but not to the main top image.","Compress with Squoosh or TinyPNG before uploading."],
 tools:["shortpixel","imagify","smush","squoosh","tinypng"]},
"p4-on-page-content":{all:["Open the top 3 results for your keyword.","List the headings and questions they all cover.","Make sure your page covers each one, with your own examples.","Add a clear call to action and trust details such as author and contact."],tools:["yoast","rankmath"]},

"p5-site-architecture":{
 wp:["Go to Appearance, then Menus, and keep only your most important pages in the main menu.","Group related pages under a clear parent page, and use categories for posts.","Turn on breadcrumbs in Yoast (Search appearance) or Rank Math."],

 wix:["Open Pages & Menu and drag pages into sub-menus.","Keep the main menu short and put important pages first."],
 code:["Plan folders like `/category/page/` so the structure shows in the URL.","Add a navigation menu linking to every top-level section.","Add breadcrumb links on inner pages."],
 tools:["screamingfrog","yoast","rankmath"]},

 sh:["Shopify creates `yourstore.com/sitemap.xml` automatically.","Submit that address in Search Console under Sitemaps."],

 tools:["gsc","yoast","rankmath"]},
"p5-robots":{
 wp:["Go to Settings, then Reading. On a live site, make sure “Discourage search engines from indexing this site” is OFF.","View or edit robots.txt in Yoast (Tools, File editor) or Rank Math (General Settings, Edit robots.txt).","To keep one page out of search, set noindex in the plugin's Advanced box."],
 sh:["Shopify creates robots.txt for you. Advanced users can change it with a `robots.txt.liquid` theme file.","Hiding a single page from search needs a small theme edit or an SEO app."],
 wix:["Wix creates robots.txt for you. Edit it under Marketing & SEO, then SEO Tools, then Robots.txt Editor.","To hide one page: Pages & Menu, three dots, SEO basics, and turn off “Let search engines index this page”."],
 code:["Create a plain text file called `robots.txt` in the root of your site.","Example: `User-agent: *` then `Disallow: /admin/` then `Sitemap: https://yoursite.com/sitemap.xml`","To keep one page out of search, add `<meta name=\"robots\" content=\"noindex\">` in its `<head>`."],
 tools:["gsc","yoast","rankmath"]},
"p5-status-codes":{all:["Visit a made-up address on your site, such as `yoursite.com/abc123`, and confirm you see your “page not found” page.","Run Screaming Frog and open Response Codes to list every 3xx, 4xx and 5xx URL.","Fix 404s by redirecting to the right page or removing links to them.","If you see repeated 5xx errors, contact your host."],tools:["screamingfrog","gsc"]},
"p5-redirects":{
 wp:["Install the free Redirection plugin, or use Rank Math Redirections or Yoast Premium's redirect manager.","Enter the old address as the Source URL and the new address as the Target URL.","Choose 301 (Moved permanently), save, and test the old address."],
 sh:["Open Online Store, then Navigation, then View URL redirects.","Click Create URL redirect, enter the old and new paths, and save."],
 wix:["Open Marketing & SEO, then SEO Tools, then URL Redirect Manager.","Enter the old and new URL and save."],
 code:["Apache (.htaccess): `Redirect 301 /old-page/ https://yoursite.com/new-page/`","Nginx: `return 301 https://yoursite.com/new-page/;` inside a location block.","Netlify (_redirects file): `/old-page /new-page 301`","Next.js: add a redirects entry with `permanent: true` in `next.config.js`."],
 tools:["redirection","screamingfrog","rankmath","yoast"]},
"p5-duplicates":{
 wp:["Yoast and Rank Math add a canonical tag to every page automatically.","To change one, open the Advanced box in the plugin and set the Canonical URL.","Under Settings, then General, check your WordPress and Site address use one version (https, with or without www)."],
 sh:["Shopify adds canonical tags automatically.","Remove true duplicate pages by redirecting or deleting them."],
 wix:["Wix adds canonical tags automatically.","In Domains, set one version of your address (with or without www) as the primary domain."],
 code:["Add this inside every page's `<head>`, pointing to that page's own preferred address: `<link rel=\"canonical\" href=\"https://yoursite.com/page/\">`","At the server, redirect http to https and www to non-www (or the reverse), so only one version works.","Avoid parameter URLs for content, or point them to the clean address with a canonical."],
 tools:["screamingfrog","gsc","yoast","rankmath"]},
"p5-mobile-js":{all:["Open your site on a phone and check text size, buttons and menus.","In Search Console, use URL Inspection, then Test live URL, then View tested page to see what Google sees.","If key text is missing there, move it into the main HTML or use server-side rendering."],tools:["gsc","psi"]},
"p5-schema":{
 wp:["In Yoast or Rank Math, fill in your organisation or person details in the schema settings.","For a page, use the Schema tab in its SEO box to pick Article, Product, FAQ and so on.","Test the page in Google's Rich Results Test."],
 sh:["Most Shopify themes already include Product schema.","Test a product page in the Rich Results Test. If something is missing, use an app or ask a developer to edit the theme."],
 wix:["Wix adds common types such as Product and Blog automatically.","For more, open Marketing & SEO, then SEO Tools, then Structured Data Markup."],
 code:["Add a JSON-LD script in the `<head>`: `<script type=\"application/ld+json\">{ \"@context\": \"https://schema.org\", \"@type\": \"LocalBusiness\", \"name\": \"Your Business\", \"telephone\": \"+1-555-0100\" }<\/script>`","Make sure every value matches what the page shows.","Validate in the Rich Results Test and the Schema.org validator."],
 tools:["richresults","schemaval","yoast","rankmath"]},
"p5-core-web-vitals":{all:["Open PageSpeed Insights, paste your page and choose Mobile.","Read the Core Web Vitals Assessment at the top. It uses real visitor data.","If a number is orange or red, scroll to Diagnostics to see the cause.","In Search Console, open Experience, then Core Web Vitals, to see groups of slow pages."],tools:["psi","gsc"]},
"p5-speed-fixes":{
 wp:["Install a caching plugin: WP Rocket (paid) or LiteSpeed Cache (free, works best on LiteSpeed hosting).","Compress images with ShortPixel, Imagify or Smush.","Remove plugins you do not use and avoid heavy page-builder widgets.","Turn on a CDN such as Cloudflare (a free plan exists)."],
 sh:["Compress images before uploading and remove apps you do not use, since each can add code.","Choose a lightweight theme and avoid large sliders and videos at the top of the page.","Test with PageSpeed Insights after each change."],
 wix:["Upload images that are large enough but not huge. Wix optimises them.","Remove unused apps and animations, and keep the first screen simple.","Check the Site Speed dashboard in Wix."],
 code:["Compress images and serve WebP or AVIF.","Minify CSS and JS and load non-critical scripts with `defer`.","Put the site behind a CDN (Cloudflare's free plan works) and set caching headers.","Set width and height on images to avoid layout shift."],
 tools:["psi","wprocket","litespeed","cloudflare","shortpixel","imagify"]},

"p6-backlinks":{all:["Verify your site in Ahrefs Free, or open Search Console, then Links.","Look at Top linking sites and Top linked pages.","Note which linking sites are relevant and trusted."],tools:["gsc","ahrefs","semrush"]},
"p6-link-quality":{all:["Open a site that links to you, or a site you want a link from.","Check: real content, real audience, relevant topic.","Check the link sits inside useful content, not in a list of paid links.","Skip any site you would not want to be associated with."],tools:["ahrefs","semrush"]},
"p6-link-building":{all:["Pick one asset to create: a guide, data study, template or tool.","Make a list of 20 relevant sites or writers who would use it.","Send short, personal emails explaining why it helps their readers.","Track replies in a sheet."],tools:["ahrefs","ubersuggest","sheets"]},
"p6-brand-mentions":{all:["Set up Google Alerts for your brand name.","When you find a mention without a link, send a polite thank-you and ask for a link.","Offer yourself as an expert source to local news and industry sites."],tools:["googlealerts"]},
"p6-link-spam":{all:["In Search Console, open Links and review Top linking sites.","Use a backlink tool to find links that look unnatural.","Try to get bad links removed by contacting the site owner.","Only as a last resort, upload a disavow file using Google's Disavow tool."],tools:["gsc","ahrefs"]},
"p6-local-seo":{all:["Search “[your service] near me” on your phone and note who appears on the map.","Claim and complete your Google Business Profile.","Make your name, address and phone identical everywhere.","Collect reviews and add a page for each location."],tools:["gbp","whitespark","brightlocal"]},
"p6-gbp":{all:["Go to `business.google.com` and search for your business. Claim it, or create a new profile.","Verify it using the method Google offers (video, phone, email or postcard).","Fill in every field: category, hours, services, description and photos.","Add your website link, and post an update every few weeks."],tools:["gbp"]},
"p6-nap-citations":{all:["Write your exact business name, address and phone in a note.","Check them on your website, Google Business Profile and your key directories.","Fix every mismatch.","Add your listing to relevant local and industry directories."],tools:["whitespark","brightlocal","sheets"]},
"p6-reviews":{all:["In your Google Business Profile, copy the link for asking for reviews.","Send it by WhatsApp, SMS or email after a good experience.","Reply to every review within a few days."],tools:["gbp"]},
"p6-local-pages":{
 wp:["Create a page for each location under Pages, then Add New.","Add the address, map, hours, photos and details that are unique to that place.","Add LocalBusiness schema with Yoast's Local SEO or Rank Math."],
 sh:["Create a page for each store under Online Store, then Pages.","Put the address, hours and map on each page. Do not copy text between pages."],
 wix:["Add a page for each location in Pages & Menu.","Give each page its own address, map, photos and text."],
 code:["Create one page per location, such as `/locations/mumbai/`.","Add the address, map, hours and unique content.","Add LocalBusiness JSON-LD that matches the page."],
 tools:["yoast","rankmath","richresults"]},

"p7-ai-overviews":{all:["Search your target questions on Google and note whether an AI answer appears.","Check which pages it links to and what they do well.","Make sure your page answers the question clearly near the top, is indexable and has no `nosnippet` setting.","Track clicks and impressions in Search Console."],tools:["gsc"]},
"p7-geo-aeo":{all:["Ask ChatGPT, Gemini and Perplexity the questions your customers ask.","Note which sources they mention and whether your brand appears.","Put a direct answer at the top of each key page, with clear headings and facts.","Check that robots.txt does not block AI crawlers you want to allow, and look for referral traffic from these tools in GA4."],tools:["aichat","ga4"]},
"p7-entity-seo":{all:["Write one standard description of your brand and use it everywhere.","Create an About page and author pages.","Add Organization schema with `sameAs` links to your official profiles.","Claim profiles such as Google Business Profile and LinkedIn."],tools:["yoast","rankmath","richresults"]},
"p7-migrations":{all:["Crawl the old site with Screaming Frog and export every URL.","Map each old URL to its new URL in a sheet.","Set up 301 redirects before launch and test them on staging.","After launch, submit the new sitemap, check Search Console daily for errors and compare traffic weekly."],tools:["screamingfrog","gsc","sheets"]},
"p7-traffic-drops":{all:["Compare GA4 and Search Console to confirm the drop is real.","Find the date it started and whether it affects the whole site, one section or a few pages.","Check for technical causes: robots.txt, noindex, redirects, server errors, a recent change.","Check Google's status dashboard for updates, and look at the SERP for new competitors or features."],tools:["gsc","ga4","screamingfrog"]},
"p7-international":{
 wp:["Use a translation plugin such as TranslatePress or Polylang (free versions exist) or Weglot (small free plan, then paid).","Choose language URLs in subfolders, such as `/fr/`.","These plugins add hreflang tags automatically. View a page's source to check."],
 sh:["Use Shopify Markets and the Translate & Adapt app to add languages and countries.","Shopify adds hreflang tags automatically."],
 wix:["Use Wix Multilingual to add languages.","Wix adds hreflang tags automatically."],
 code:["Create a folder for each language, such as `/fr/` and `/de/`.","In each page's `<head>`, add one line per version: `<link rel=\"alternate\" hreflang=\"fr\" href=\"https://yoursite.com/fr/\">`","Include a line for the page itself and one with `hreflang=\"x-default\"`."],
 tools:["weglot","polylang","translatepress"]},
"p7-programmatic":{all:["Build a spreadsheet of unique data for each page.","Create one page template and fill it from the sheet.","Publish 10 pages first and check indexing and clicks in Search Console.","Scale up only if those pages perform."],tools:["sheets","gsc"]},
"p7-ecommerce":{
 wp:["Use WooCommerce with Yoast or Rank Math.","Write a unique title and description for every product and category.","Keep filter URLs out of the index or point them to the clean category page."],
 sh:["Write a unique description and Search engine listing for each product and collection.","Check product schema with the Rich Results Test. Add reviews with a reviews app.","Avoid duplicate pages from variants and filters."],
 wix:["Use the SEO fields on each Wix Stores product and category.","Write unique descriptions. Do not reuse supplier text."],
 code:["Create category pages with unique text and clean URLs.","Add Product JSON-LD with price, availability and reviews.","Use canonical tags on filtered or sorted pages."],
 tools:["yoast","rankmath","richresults","screamingfrog"]},
"p7-audit-process":{all:["Crawl the site with Screaming Frog.","Check Search Console: indexing, performance and Core Web Vitals.","Review the top pages: titles, content and internal links.","Check the backlink profile.","List findings in a sheet with Impact and Effort columns, and fix the high-impact, low-effort items first."],tools:["screamingfrog","gsc","psi","ahrefs","sheets"]},
"p7-seo-reporting":{all:["Build a Looker Studio report with Search Console and GA4.","Add: organic clicks, impressions, average position, organic sessions and conversions.","Add last month's and last year's comparison.","Write three lines: what happened, why, what next."],tools:["lookerstudio","gsc","ga4"]}
};

(function(){

  QUIZ.forEach(function(ph){

 ["Putting key text or links where they only appear after a click or script.","Make sure important content is in the rendered HTML, then compare it in URL Inspection."]],
"p1-search-intent":[
 ["Writing a blog post for a keyword where page one shows product pages, or the other way round.","Read page one first and match the format that is winning: guide, list, product page or tool."],
 ["Treating every keyword as a buying keyword.","Label each keyword informational, navigational, commercial or transactional, then give each type the right kind of page."],
 ["Guessing intent from the keyword alone.","Look at the results. They show what Google thinks the searcher wants."]],
"p1-helpful-content":[

 ["Rewriting what the top results already say.","Add something only you have: a first-hand example, your own data, a screenshot or an expert's view."]],
"p1-spam-policies":[
 ["Mass-producing pages with AI and publishing them unchecked.","Use AI for drafts only. A human checks the facts and adds real experience before anything goes live."],

 ["Repeating the keyword or hiding text to look more relevant.","Write naturally. If you would hide a tactic from Google, do not use it."]],
"p1-algorithm-updates":[
 ["Making changes while an update is still rolling out.","Wait until the rollout ends, then analyse. Hurried changes confuse the picture."],
 ["Treating a core update as a penalty and hunting for one quick fix.","Compare the pages that fell with the pages that gained, then improve quality across the site."],
 ["Blaming Google for a drop you caused yourself.","Rule out your own changes first: a migration, a `noindex`, a robots.txt edit or a plugin update."]],
"p2-gsc-setup":[
 ["Adding only one URL version, such as `http://www`.","Add a Domain property, verified through DNS, so every version of your URLs is covered."],
 ["Verifying the site and then never looking again.","Check Search Console weekly. It also emails alerts about serious problems."],
 ["Expecting data the same day.","Data usually appears after a few days. It covers roughly the last 16 months."]],
"p2-gsc-performance":[
 ["Reading only the totals.","Filter by page or query. Totals show the size of the change, and filters show where it happened."],
 ["Treating average position as one exact ranking.","It is a mean across many queries. Look at the position of your top queries and pages instead."],
 ["Ignoring pages at positions 8 to 20 with decent impressions.","These are the quickest wins. Improve the title, content and internal links for them first."]],
"p2-gsc-indexing":[
 ["Pressing Request indexing again and again.","It is a request, not a command. Find out why the page is not indexed, fix that, then request once."],
 ["Treating “Crawled, currently not indexed” as a technical bug.","It is often a quality or duplicate issue. Improve the content and add internal links."],

"p2-ga4-basics":[

 ["Expecting GA4 and Search Console numbers to match.","They count different things: clicks from Google versus sessions on your site. Compare the trend, not the exact numbers."],
 ["Looking for bounce rate as the main quality number.","Use engagement rate. A session counts as engaged after 10 seconds, a key event or 2 or more page views."]],
"p2-ga4-conversions":[

 ["Marking every event as a key event.","Mark only the actions that matter to the business: forms, calls, WhatsApp clicks and bookings."],
 ["Reporting traffic without conversions.","Show organic conversions next to organic sessions, so the work is tied to a business result."]],
"p2-pagespeed":[

 ["Testing only on desktop.","Test mobile first. Mobile results matter more."],
 ["Testing only the homepage.","Test one page from each key template, such as home, category and post."]],
"p3-keyword-metrics":[
 ["Picking the keywords with the biggest volume.","Check relevance and intent first. A smaller keyword that fits your business beats a big one that does not."],
 ["Treating keyword difficulty as a fact.","Each tool calculates it differently. Read the real results page and see who ranks."],
 ["Ignoring traffic potential.","Look at the total traffic the top page gets. It is often more useful than volume."]],
"p3-keyword-process":[
 ["Using only the keywords a tool suggests.","Start with your customers’ own words, then add Google Suggest and People Also Ask."],

 ["Keeping the list in your head or in scattered notes.","Record keyword, volume, difficulty, intent and target page in one sheet."]],
"p3-keyword-mapping":[

 ["Never updating the map.","Update it whenever you publish or retire a page. The Templates page has a keyword map to start with."]],
"p3-content-writing":[

 ["Making the page longer instead of better.","Cover the topic better than the current top results. Length alone is not the goal."],
 ["Burying the answer under a long introduction.","Answer the main question early, then add depth."]],
"p3-content-refresh":[

 ["Forgetting to ask Google to look again.","Request indexing after a major update."]],
"p4-title-tags":[
 ["Stuffing the title with keywords.","Put the main keyword near the start and write for humans."],
 ["Using the same title on many pages.","Make every title unique. Check the full list with a crawl in Screaming Frog."],
 ["Writing titles that are too long.","Aim for about 50 to 60 characters so the title is not cut off. Google may also rewrite titles that are stuffed or vague."]],
"p4-meta-descriptions":[

 ["Expecting them to lift rankings directly.","They help people decide to click. Describe the benefit and give a reason to click."],
 ["Being surprised when Google shows a different one.","Google often rewrites descriptions to match the query. A clear, useful one still gives it the best material."]],
"p4-headings":[
 ["Using a heading tag just to make text bigger or smaller.","Choose headings by structure and use styling for the look. H1 for the topic, H2 for sections, H3 for subsections."],
 ["Ending up with more than one H1.","Themes and page builders can add an extra H1, such as the site name. Check the page and keep one H1 that states the topic."],
 ["Skipping levels, such as H2 straight to H4.","Keep the order, so the headings read like an outline."]],

 ["Ignoring how the text sounds.","Read it aloud. If it sounds unnatural, rewrite it."]],

 ["Using “click here” or “read more” as the link text.","Use descriptive anchor text that tells people and Google what is on the other page."],

 ["Relying on the menu alone.","Add contextual links inside the body copy, and keep important pages within 3 clicks of the homepage."]],

 ["Expecting schema to raise rankings.","It does not boost rankings directly. It improves clarity and eligibility for rich results."],
 ["Expecting a rich result for every type of markup.","Google has limited some, such as FAQ. Check current eligibility first."]],
"p5-core-web-vitals":[

 ["Checking desktop only.","Mobile and desktop are judged separately, so check both and fix mobile first."],
 ["Letting images, ads or fonts shift the page as it loads.","Set width and height on images and reserve space for ads. This is what keeps CLS at 0.1 or less."]],

 ["Stacking several speed or cache plugins.","Use one caching tool and remove the ones you do not need."],

 ["Ignoring third-party scripts.","Delay chat widgets, trackers and ad scripts where you can."]],
"p6-backlinks":[
 ["Counting raw links instead of referring domains.","Track unique sites linking to you. One hundred links from one site count as one site."],

 ["Expecting results in a week.","Links take time. Aim for steady month-to-month growth."]],
"p6-link-building":[

 ["Sending the same outreach email to hundreds of sites.","Write to fewer, relevant sites, and say why the link helps their readers."],
 ["Guest posting for the link alone.","Contribute only where your article gives the readers real value."]],
"p6-link-spam":[

 ["Not marking paid links.","Add the `sponsored` attribute to paid links."],
 ["Building links you may later regret.","Prevention beats cleanup. Do not build links you might need to disavow."]],
"p6-gbp":[

"p6-nap-citations":[

 ["Chasing hundreds of low-quality directories.","Prioritise major platforms and directories that suit your industry or area."]],
"p6-reviews":[

 ["Ignoring bad reviews.","Reply politely to every review, good or bad."]],
"p6-local-pages":[
 ["Copying one page for dozens of towns and changing only the town name.","Create a page only where you can add real local detail. Near-identical pages are doorway spam."],

 ["Adding LocalBusiness markup that does not match the page.","Make the structured data match what is visible on the page."]],

 ["Tracking clicks only.","Also track visibility, brand searches and conversions, because some clicks may fall."]],
"p7-geo-aeo":[

 ["Dropping SEO to focus on AI.","GEO and AEO build on SEO. They do not replace it."]],

 ["Assuming it was a Google update.","Check robots.txt, `noindex`, redirects, server errors and any recent migration before blaming an update."]],
"p7-international":[

 ["Translating word for word.","Localise currency, examples and search terms for each market."]],
"p7-programmatic":[

 ["Scaling before testing.","Start small, check indexing and engagement, then scale."]],
"p7-ecommerce":[

 ["Letting every filter create a crawlable URL.","Control faceted navigation, so filters do not create duplicates or waste crawling."],
 ["Deleting out-of-stock pages without thinking.","Decide on purpose whether to keep, redirect or remove each one."]],

var TERM_MAP = {}, TERM_RE;
(function(){
  var pats = [];
  GLOSS.forEach(function(g, k){ g[1].forEach(function(p){ TERM_MAP[p.toLowerCase()] = k; pats.push(p); }); });
  pats.sort(function(a, b){ return b.length - a.length; });
  TERM_RE = new RegExp("(^|[^A-Za-z0-9])(" + pats.map(function(p){ return p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")(?![A-Za-z0-9])", "gi");
})();

function linkTerms(html, used){
  return html.split(/(<code>.*?<\/code>)/).map(function(part, i){
    if (i % 2) return part;
    return part.replace(TERM_RE, function(m, pre, word){
      var k = TERM_MAP[word.toLowerCase()];
      if (k === undefined || used[k]) return m;
      used[k] = 1;
      return pre + '<button class="term" type="button" data-k="' + k + '">' + word + '</button>';
    });
  }).join("");
}

function syncNav(){

  });

    var pi = sec.getAttribute("data-pi"), any = false;

      var match = !q || searchHit(li.getAttribute("data-id"), q, li.getAttribute("data-title"));

      var a = li.querySelector("a");
      if (id === cur) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");

function viewQuiz(n){
  var p = PHASES[n - 1], qs = QUIZ[n - 1];
  if (!p || !qs) return viewHome();
  var st = {i:0, score:0, missed:[]};
  var head = '<div class="wrap ' + toneClass(p) + '"><p class="crumb"><a href="#">All phases</a> / <a href="#phase-' + p.n + '">Phase ' + p.n + ': ' + esc(p.t) + '</a> / Quiz</p><h1>Phase ' + p.n + ' quiz</h1>';
  document.title = "Phase " + p.n + " quiz - SEO Study Guide";
  function ask(){
    var q = qs[st.i];
    var h = head + '<div class="qprog"><span>Question ' + (st.i + 1) + ' of ' + qs.length + '</span><div class="qbar" aria-hidden="true"><i style="width:' + (100 * st.i / qs.length) + '%"></i></div></div>' +
      '<h2 class="qq">' + esc(q.q) + '</h2><div class="opts" role="group" aria-label="Answers">';
    q.o.forEach(function(o, k){ h += '<button type="button" class="opt" data-i="' + k + '">' + esc(o) + '</button>'; });
    h += '</div><div class="fb" id="fb" role="status" aria-live="polite" hidden></div><div class="actions"><button type="button" class="btn main" id="qNext" hidden></button></div></div>';
    viewEl.innerHTML = h;
    viewEl.scrollTop = 0;
    var btns = viewEl.querySelectorAll(".opt");
    Array.prototype.forEach.call(btns, function(b){
      b.addEventListener("click", function(){ pick(+b.getAttribute("data-i")); });
    });
  }
  function pick(k){
    var q = qs[st.i], ok = k === q.a, btns = viewEl.querySelectorAll(".opt");
    Array.prototype.forEach.call(btns, function(b, idx){
      b.disabled = true;
      if (idx === q.a) b.classList.add("right");
      else if (idx === k) b.classList.add("wrong");
    });
    if (ok) st.score++; else st.missed.push(q);
    var fb = document.getElementById("fb");
    fb.innerHTML = '<b>' + (ok ? 'Correct.' : 'Not quite. The answer is: ' + esc(q.o[q.a])) + '</b>' + esc(q.e);
    fb.hidden = false;
    var nb = document.getElementById("qNext");
    nb.textContent = st.i + 1 < qs.length ? "Next question" : "See my score";
    nb.hidden = false;
    nb.addEventListener("click", function(){ st.i++; if (st.i < qs.length) ask(); else done(); });
    try { nb.focus(); } catch (e) {}
  }
  function done(){
    var prev = quizBest[n];
    if (prev === undefined || st.score > prev) { quizBest[n] = st.score; saveJSON(QUIZ_KEY, quizBest); }
    var msg = st.score === qs.length ? "Perfect. You have this phase." : st.score >= 3 ? "Good work. Revisit the topics below to close the gaps." : "A good start. Reread the topics below, then try again.";
    var h = head + '<p class="score">' + st.score + ' of ' + qs.length + '</p><p class="lead">' + msg + '</p><p class="hint">Best score: ' + quizBest[n] + ' of ' + qs.length + '</p>';
    if (st.missed.length) {
      h += '<h2>Review these topics</h2><ul class="tlist">';
      var seen = {};
      st.missed.forEach(function(q){
        if (seen[q.id] || !BYID[q.id]) return;
        seen[q.id] = 1;
        h += '<li><a href="#' + q.id + '">' + esc(BYID[q.id].title) + '</a></li>';
      });
      h += '</ul>';
    }
    h += '<div class="actions"><button type="button" class="btn main" id="qAgain">Try again</button><a class="btn" href="#phase-' + p.n + '">Back to phase ' + p.n + '</a>' +
      (PHASES[n] ? '<a class="btn" href="#quiz-' + (n + 1) + '">Phase ' + (n + 1) + ' quiz</a>' : '') + '</div></div>';
    viewEl.innerHTML = h;
    viewEl.scrollTop = 0;
    document.getElementById("qAgain").addEventListener("click", function(){ st = {i:0, score:0, missed:[]}; ask(); });
  }
  ask();
}

}
function nudgeHtml(){
  var c = countData(), has = c.learned + c.notes + c.quiz + c.setup > 0, lb = lastBackup();
  var old = !lb || (Date.now() - new Date(lb).getTime()) > 30 * 24 * 3600 * 1000;
  return has && old ? '<p class="nudge">Your progress and notes are saved only in this browser. <a href="#backup">Save a backup</a> so you never lose them.</p>' : "";
}

function viewBackup(){
  var c = countData(), lb = lastBackup(), keys = Object.keys(notes);
  var order = {}; FLAT.forEach(function(t, i){ order[t.id] = i; });
  keys.sort(function(a, b){ return order[a] - order[b]; });
  var h = '<div class="wrap tone-a"><p class="crumb"><a href="#">All phases</a> / Notes and backup</p>' +
    '<h1>Notes and backup</h1><p class="lead">Your progress, quiz scores, checklist and notes are saved in this browser only. Save a backup file now and then. You can load it again on any device.</p>' +
    '<h2>Save a backup</h2><p class="stat">Right now you have <b>' + c.learned + '</b> topics learned, <b>' + c.notes + '</b> notes, <b>' + c.quiz + '</b> quiz scores and <b>' + c.setup + '</b> checklist items. Last backup: <b>' + (lb ? fmtDate(lb) : 'never') + '</b>.</p>' +
    '<div class="actions"><button type="button" class="btn main" id="bkDl">Download backup file</button></div>' +
    '<p class="hint" id="bkMsg" role="status" aria-live="polite"></p>' +
    '<details class="tpl"><summary><span>Copy the text instead</span></summary><div class="dbody">' +
    '<textarea readonly rows="6" id="bkText" aria-label="Backup as text">' + esc(JSON.stringify(buildBackup())) + '</textarea>' +
    '<div class="actions"><button type="button" class="btn" id="bkCopy">Copy text</button></div>' +
    '<p class="hint">Paste it into a note or a file you will keep.</p></div></details>' +
    '<h2>Restore a backup</h2><label class="filepick">Choose your backup file <input type="file" id="bkFile" accept=".json,application/json"></label>' +
    '<details class="tpl"><summary><span>Or paste backup text</span></summary><div class="dbody">' +
    '<textarea rows="5" id="bkPaste" aria-label="Paste backup text" placeholder="Paste the backup text here"></textarea>' +
    '<div class="actions"><button type="button" class="btn" id="bkCheck">Check backup text</button></div></div></details>' +
    '<div id="bkPreview" role="status" aria-live="polite"></div>' +
    '<h2>Your notes (' + keys.length + ')</h2>';
  if (!keys.length) h += '<p class="hint">No notes yet. Open any topic and use the My notes box near the bottom.</p>';
  else {
    h += '<ul class="tlist">';
    keys.forEach(function(k){
      var s = notes[k].replace(/\s+/g, " ").trim(); if (s.length > 140) s = s.slice(0, 140) + "…";
      h += '<li><a href="#' + k + '"><span><b>' + esc(BYID[k].title) + '</b><br><span class="snip">' + esc(s) + '</span></span></a></li>';
    });
    h += '</ul>';
  }
  h += '</div>';
  viewEl.innerHTML = h;
  document.title = "Notes and backup - SEO Study Guide";
}

function showRestore(text){
  var box = document.getElementById("bkPreview"), obj;
  if (!box) return;
  try { obj = JSON.parse(text); } catch (e) { box.innerHTML = '<p class="err">That could not be read. Make sure you chose the backup file or pasted all of the text.</p>'; return; }
  var r = cleanBackup(obj);
  if (r.error) { box.innerHTML = '<p class="err">' + esc(r.error) + '</p>'; return; }
  var d = r.data;
  box.innerHTML = '<div class="task"><b>Ready to restore</b><p>This backup' + (obj.saved ? ' from ' + esc(fmtDate(obj.saved)) : '') + ' has <b>' + Object.keys(d.learned).length + '</b> topics learned, <b>' +
    Object.keys(d.notes).length + '</b> notes, <b>' + Object.keys(d.quiz).length + '</b> quiz scores and <b>' + Object.keys(d.setup).length + '</b> checklist items. Restoring replaces what is saved in this browser now.</p>' +
    '<div class="actions"><button type="button" class="btn main" id="bkGo">Replace my data</button><button type="button" class="btn" id="bkNo">Cancel</button></div></div>';
  document.getElementById("bkNo").addEventListener("click", function(){ box.innerHTML = ""; });
  document.getElementById("bkGo").addEventListener("click", function(){
    applyBackup(d);
    syncNav();
    viewBackup();
    var b2 = document.getElementById("bkPreview");
    if (b2) b2.innerHTML = '<p class="okmsg">Restored. Your progress and notes are back.</p>';
  });
}

/* ---------- change log ---------- */
function viewChanges(){
  var h = '<div class="wrap tone-a"><p class="crumb"><a href="#">All phases</a> / What changed</p><h1>What changed</h1>' +
    '<p class="lead">Guide updated ' + GUIDE_UPDATED + '. Prices and facts were last checked in ' + REVIEWED + '.</p>';
  CHANGELOG.forEach(function(c){
    h += '<h2>' + esc(c.t) + ' <span class="count">' + esc(c.d) + '</span></h2><ul class="points">' + c.b.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
  });
  var flagged = FLAT.filter(function(t){ return VOLATILE[t.id]; });
  h += '<h2>Topics that change often</h2><p class="hint">Check these against Google\'s own documentation before you rely on the details.</p><ul class="chips">' +
    flagged.map(function(t){ return '<li><a href="#' + t.id + '">' + esc(t.title) + '</a></li>'; }).join("") + '</ul>' +
    '<div class="task"><b>How to read the dates</b><p>“Last updated” on a topic is when I last edited or checked it. It is not a promise that Google has not changed something since.</p></div></div>';
  viewEl.innerHTML = h;
  document.title = "What changed - SEO Study Guide";
}

/* ---------- clicks and changes ---------- */
viewEl.addEventListener("input", onViewInput);
viewEl.addEventListener("click", function(e){
  var t = e.target && e.target.closest ? e.target.closest("button") : null;
  if (!t) return;
  var id = t.id, dl = t.getAttribute("data-dl"), cp = t.getAttribute("data-copy");
  if (dl) {
    var tp = tplById(dl), msg = document.getElementById("dl-" + dl);
    if (tp) {
      offerFile("seo-" + tp.id + "-template.csv", toCSV(tp), "text/csv;charset=utf-8", msg, "Saved.", "use “Copy and paste into a sheet instead” below.");
    }
  } else if (cp) {
    var ta = document.getElementById(cp), m = document.getElementById(t.getAttribute("data-msg"));
    if (ta) { var ok = copyFrom(ta); if (m) m.textContent = ok ? "Copied. Paste it into a sheet." : "Text selected. Press Ctrl+C (Cmd+C on Mac) to copy."; }
  } else if (id === "bkDl") {
    var name = "seo-study-guide-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    offerFile(name, JSON.stringify(buildBackup(), null, 1), "application/json", document.getElementById("bkMsg"), "Backup saved.", "use the copy-the-text option below.", markBackup);
  } else if (id === "bkCopy") {
    var bt = document.getElementById("bkText"), bm2 = document.getElementById("bkMsg");
    if (bt) { var ok2 = copyFrom(bt); markBackup(); if (bm2) bm2.textContent = ok2 ? "Copied. Paste it into a note or file you will keep." : "Text selected. Press Ctrl+C (Cmd+C on Mac) to copy."; }
  } else if (id === "bkCheck") {
    var bp = document.getElementById("bkPaste");
    if (bp) showRestore(bp.value);
  }
});
viewEl.addEventListener("change", function(e){
  var t = e.target;
  if (t && t.id === "bkFile" && t.files && t.files[0]) {
    var fr = new FileReader();
    fr.onload = function(){ showRestore(String(fr.result)); };
    fr.onerror = function(){ var box = document.getElementById("bkPreview"); if (box) box.innerHTML = '<p class="err">That file could not be read.</p>'; };
    fr.readAsText(t.files[0]);
  }
});
navEl.addEventListener("click", function(e){
  var a = e.target && e.target.closest ? e.target.closest("a[data-gq]") : null;
  if (!a) return;
  pendingGQ = a.getAttribute("data-gq");
  if (location.hash === "#glossary") { e.preventDefault(); route(); }
});

function route(){
  var hash = (location.hash || "").slice(1);
  var m = /^phase-(\d)$/.exec(hash);
  if (m) { openPhases[+m[1]-1] = true; viewPhase(+m[1]); }
  else if (/^quiz-\d$/.test(hash)) { var qn = +hash.slice(5); openPhases[qn-1] = true; viewQuiz(qn); }
  else if (hash === "glossary") viewGlossary();
  else if (hash === "setup") viewSetup();
  else if (hash === "quick") viewQuick();
  else if (hash === "tools") viewTools();
  else if (hash === "templates") viewTemplates();
  else if (hash === "backup") viewBackup();
  else if (hash === "changes") viewChanges();
  else if (hash === "resources") viewResources();
  else if (BYID[hash]) { openPhases[BYID[hash].pi] = true; viewTopic(BYID[hash]); }
  else viewHome();
  syncNav();
  viewEl.scrollTop = 0;
  navEl.classList.remove("open");
  menuBtn.setAttribute("aria-expanded","false");
  var cur = navEl.querySelector('[aria-current="page"]');
  if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({block:"nearest"}); } catch(e){} }
}

menuBtn.addEventListener("click", function(){
  var open = navEl.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
viewEl.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".term") : null;
  var box = document.getElementById("termbox");
  if (b && box) {
    var g = GLOSS[+b.getAttribute("data-k")];
    document.getElementById("tbT").textContent = g[0] + ":";
    document.getElementById("tbD").textContent = g[2] + (g[3] ? " " + g[3] : "");
    box.hidden = false;
  } else if (e.target.id === "tbX" && box) {
    box.hidden = true;
  }
});
window.addEventListener("hashchange", route);
buildNav();
route();
</script>
</body>
