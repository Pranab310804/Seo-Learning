<html lang="en">

<meta name="theme-color" content="#0E7C6B">
<meta property="og:type" content="website">
<meta property="og:title" content="SEO Study Guide: learn SEO from zero">
<meta property="og:description" content="7 phases, 66 topics, plain-English explanations, implementation steps, tools, quizzes and templates.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C6B'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: fixed index column on the left, scrolling reading pane on the right */
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14212B; --muted:#566874; --line:#D9E0E6;
  --teal:#0E7C6B; --teal-soft:#DDF2EE; --indigo:#4F4BC4; --indigo-soft:#E7E6FA; --focus:#1B6FDB;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171D; --surface:#17222B; --ink:#E8EEF2; --muted:#9FB0BC; --line:#2A3944;
    --teal:#4FD1BB; --teal-soft:#123A34; --indigo:#A9A7F7; --indigo-soft:#26254F; --focus:#6FA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17222B; --ink:#E8EEF2; --muted:#9FB0BC; --line:#2A3944;
  --teal:#4FD1BB; --teal-soft:#123A34; --indigo:#A9A7F7; --indigo-soft:#26254F; --focus:#6FA8FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.tone-a{--t:var(--teal);--ts:var(--teal-soft)}
.tone-b{--t:var(--indigo);--ts:var(--indigo-soft)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:600;font-size:1.2rem;text-decoration:none;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:500}

.shell{position:relative;display:grid;grid-template-columns:330px minmax(0,1fr);min-height:0}
nav{min-height:0;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 12px 28px}
main{min-height:0;overflow:auto;padding:32px clamp(16px,4vw,56px) 64px}
main:focus{outline:none}

.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;margin-bottom:12px}
.ph{margin-bottom:6px}
.ph-head{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 8px;border-radius:8px}
.ph-head:hover{background:var(--bg)}
.num{flex:none;width:26px;height:26px;border-radius:7px;background:var(--t);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:.82rem}
.ph-name{flex:1;font-weight:600;font-size:.95rem;line-height:1.25}
.ph-name small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.chev{flex:none;color:var(--muted);transition:transform .15s}
.ph.open .chev{transform:rotate(90deg)}
.ph ul{list-style:none;margin:2px 0 6px 20px;padding:0 0 0 14px;border-left:2px solid var(--ts);display:none}
.ph.open ul{display:block}
.ph li a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:.9rem;color:var(--muted)}
.ph li a:hover{background:var(--bg);color:var(--ink)}
.ph li a[aria-current="page"]{background:var(--ts);color:var(--ink);font-weight:500}
.tick{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.done .tick{background:var(--t);border-color:var(--t)}
.ph li.hide{display:none}
.phase-link{display:block;margin:2px 0 2px 0;padding:4px 8px;font-size:.82rem;color:var(--t);text-decoration:none;font-weight:500}
.phase-link:hover{text-decoration:underline}

.wrap{max-width:70ch}
.crumb{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.crumb a{color:var(--t);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,1.2rem + 1.8vw,2.3rem);line-height:1.15;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:28px 0 10px;letter-spacing:.01em}
.lead{font-size:1.1rem;line-height:1.6;margin:0 0 6px}
.points{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.points li{position:relative;padding:10px 14px 10px 38px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.points li::before{content:"";position:absolute;left:15px;top:19px;width:10px;height:10px;border-radius:3px;background:var(--t)}
.remember{margin:26px 0 0;padding:16px 18px;border-radius:12px;background:var(--ts);border:1px solid var(--t)}
.remember b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t);margin-bottom:4px}
.remember p{margin:0;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--t)}
.btn.main[aria-pressed="true"]{background:var(--t);border-color:var(--t);color:var(--surface)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.pn a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none}
.pn a:hover{border-color:var(--t)}
.pn small{display:block;color:var(--muted);font-size:.78rem}
.pn .next{text-align:right}
.task{margin-top:24px;padding:16px 18px;border:1px dashed var(--t);border-radius:12px;background:var(--surface)}
.task b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t);margin-bottom:4px}
.task p{margin:0}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tlist a{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none}
.tlist a:hover{border-color:var(--t)}
.tlist .n{flex:none;width:24px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.tlist .done .tick{background:var(--t);border-color:var(--t)}
.tlist .tick{margin-left:auto}

.intro{max-width:64ch;margin:0 0 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:12px;padding:16px 18px}
.card h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0 0 2px}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card .wk{font-size:.8rem;color:var(--muted);margin:0 0 8px}
.card .goal{font-size:.9rem;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips a{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--ts);font-size:.8rem;text-decoration:none}
.chips a:hover{outline:1px solid var(--t)}
.legend{display:flex;gap:18px;font-size:.82rem;color:var(--muted);margin:0 0 18px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--t)}

.term{border:0;background:transparent;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;border-bottom:1.5px dotted var(--t);cursor:help}
.term:hover{background:var(--ts)}
.termbox{position:sticky;bottom:14px;margin-top:20px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--t);border-radius:12px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.14)}
.termbox[hidden]{display:none}
.termbox>div{flex:1}
.termbox b{color:var(--t)}
.termbox a{color:var(--t);font-size:.85rem;margin-left:6px}
.termbox button{border:0;background:transparent;font-size:1.4rem;line-height:1;padding:0 4px}
.simple{margin:0 0 6px;padding:16px 18px;border-radius:12px;background:var(--ts);border:1px solid var(--t)}
.simple b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t);margin-bottom:4px}
.simple p{margin:0;font-size:1.08rem}
.likeline{color:var(--muted);font-style:normal;display:block;margin-top:2px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 4px}
.hint a{color:var(--t)}
.callout{max-width:64ch;margin:0 0 20px;padding:12px 16px;border-radius:10px;background:var(--teal-soft);border:1px solid var(--teal)}
.callout a{color:var(--teal);font-weight:500}
.gl-link{display:block;padding:9px 12px;margin-bottom:10px;border-radius:8px;background:var(--teal-soft);color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem}
.gl-link[aria-current="page"]{outline:2px solid var(--teal)}
dl.gl{margin:0 0 8px;display:grid;gap:8px}
.gl div{padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.gl dt{font-weight:600}
.gl dd{margin:2px 0 0}
.oneminute{counter-reset:s;list-style:none;margin:0 0 26px;padding:0;display:grid;gap:8px}
.oneminute li{counter-increment:s;position:relative;padding:10px 14px 10px 48px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.oneminute li::before{content:counter(s);position:absolute;left:13px;top:11px;width:24px;height:24px;border-radius:7px;background:var(--t);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:.82rem}
/* ---- implementation guide additions ---- */
[hidden]{display:none !important}
:root{--ok:#1B6B36;--ok-soft:#E4F4E9;--warn:#7A4E00;--warn-soft:#FBEED2}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ok:#78D898;--ok-soft:#123222;--warn:#F0C26B;--warn-soft:#3A2D10}
}
:root[data-theme="dark"]{--ok:#78D898;--ok-soft:#123222;--warn:#F0C26B;--warn-soft:#3A2D10}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* sidebar hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.hub a{display:block;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:.88rem;line-height:1.25}
.hub a small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.hub a:hover{border-color:var(--teal)}
.hub a[aria-current="page"]{background:var(--teal-soft);border-color:var(--teal)}

/* home: start here */
.starts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:0 0 26px}
.starts a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;text-decoration:none}
.starts a:hover{border-color:var(--teal)}
.starts b{display:block}
.starts span{display:block;font-size:.88rem;color:var(--muted)}

/* put it into practice */
details.how,details.tools,details.notes,details.tpl,details.mist{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.how{border-color:var(--t)}
details>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-weight:600;border-radius:12px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--t);border-bottom:2px solid var(--t);transform:rotate(-45deg);transition:transform .15s;align-self:center;margin-right:2px}
details[open]>summary::before{transform:rotate(45deg)}
details>summary small{font-weight:400;color:var(--muted);font-size:.82rem}
details[open]>summary{border-bottom:1px solid var(--line);border-bottom-left-radius:0;border-bottom-right-radius:0}
details>summary:hover{background:var(--bg)}
.dbody{padding:12px 16px 16px}
.plat{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip:hover{border-color:var(--t,var(--teal))}
.chip[aria-pressed="true"]{background:var(--t,var(--teal));border-color:var(--t,var(--teal));color:var(--surface)}
ol.steps{counter-reset:st;list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
ol.steps li{counter-increment:st;position:relative;padding:6px 8px 6px 40px;overflow-wrap:anywhere}
ol.steps li::before{content:counter(st);position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--ts);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:.8rem}
ol.steps code{white-space:pre-wrap;overflow-wrap:anywhere}
.toollist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.toollist li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.th>a{font-weight:600}
.tier{font-size:.74rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.tier-free{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.tier-mix{color:var(--indigo);background:var(--indigo-soft);border-color:var(--indigo)}
.tier-paid{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.td{margin:4px 0 0}
.tp{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.used{margin:6px 0 0;font-size:.82rem;color:var(--muted)}
.used a{color:var(--t,var(--teal))}
.ok{margin-top:16px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);border:1px solid var(--ok)}
.ok b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.ok b::before{content:"\2713\00a0"}
.ok p{margin:0;font-weight:500}

/* quick reference */
.tw{overflow-x:auto;margin:0 0 8px}
table.qt{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface);border:1px solid var(--line);font-size:.93rem}
.qt th,.qt td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.qt th{font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.qt td:first-child{font-weight:600}
.qt a{color:var(--t,var(--teal))}
ul.qa{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.qa li{padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
ul.qa b{display:block}
ul.qa a{color:var(--t,var(--teal))}

/* day 1 setup */
ol.setup{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}
.chk input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--t,var(--teal))}
.chk.done{background:var(--ts);border-color:var(--t)}
.chk b{display:block}
.chk .cd{display:block;color:var(--muted);margin:2px 0 4px}
.chk a{color:var(--t,var(--teal));font-weight:500}
.count{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);margin-left:8px}

/* quizzes */
.qprog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:6px 0 14px}
.qbar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--t)}
.qq{font-size:1.25rem;margin:0 0 14px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--t)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right::after{content:"  \2713  Correct answer";color:var(--ok);font-weight:600;font-size:.85rem}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt.wrong::after{content:"  \2717  Your answer";color:var(--warn);font-weight:600;font-size:.85rem}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.fb b{display:block;margin-bottom:2px}
.score{font-family:var(--display);font-size:2.6rem;line-height:1.1;margin:8px 0 4px}

/* notes, templates, backup, dates, search */
.meta{margin:-6px 0 14px;font-size:.85rem;color:var(--muted)}
.flag{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-size:.74rem;font-weight:600}
.watch{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn);font-size:.92rem}
textarea{display:block;width:100%;font:inherit;font-size:.95rem;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
textarea[readonly]{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.dbody .actions{margin-top:10px}
.tplrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tplrow b{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t);margin-right:6px}
.tcard{margin:0 0 22px;padding:4px 20px 18px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;background:var(--surface)}
.tcard h2{margin-top:16px}
.tcard .cols{font-size:.88rem;color:var(--muted)}
.stat{margin:0 0 12px}
.filepick{display:block;margin:6px 0 4px;font-weight:500}
.filepick input{display:block;margin-top:6px;font:inherit}
.err{margin:12px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink)}
.okmsg{margin:12px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--ok);background:var(--ok-soft);color:var(--ink);font-weight:500}
.nudge{max-width:64ch;margin:0 0 20px;padding:12px 16px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--warn)}
.nudge a{color:var(--ink);font-weight:600}
.snip{color:var(--muted);font-size:.88rem}
.sres{margin:-4px 0 12px;font-size:.84rem;color:var(--muted)}
.sres p{margin:0 0 4px}
.sres .sg a{display:inline-block;margin:2px 6px 2px 0;padding:1px 9px;border-radius:99px;background:var(--teal-soft);color:var(--ink);text-decoration:none}
.sres .sg a:hover{outline:1px solid var(--teal)}

<script>
/* id, title, definition, key points, remember line */
var PHASES = [
{n:1,t:"Foundations",w:"Weeks 1-3",tone:"a",
 goal:"Understand how Google finds, stores and ranks pages, and what it expects from good content.",
 task:"Write a one-page SEO snapshot of any small site: its main keyword, the intent behind it, and three things it does well.",
 topics:[
 ["what-is-seo","What SEO is","Search engine optimisation is the practice of making a website easier for search engines to understand and more useful to people, so it earns more unpaid (organic) visits.",
  ["Organic results are free to appear in. Paid ads are bought clicks. SEO covers only the first.","Results build slowly, usually over 3 to 6 months, but keep paying off with no cost per click.","Three jobs: be findable (technical), be relevant (content), be trusted (authority).","Success is visibility, qualified traffic and business results such as leads and sales, not rankings alone."],
  "SEO is about earning the right visitor at the right moment, not tricking an algorithm."],
 ["crawling","Crawling","Crawling is how Google discovers pages. A program called Googlebot follows links and reads sitemaps to find URLs, then fetches them.",
  ["A page with no links pointing to it is hard to discover. Sitemaps help.","`robots.txt` tells crawlers which areas they may not fetch.","Crawl budget (how much Google will fetch from a site) matters mainly for very large sites.","Slow servers, errors and endless URL variations waste crawling."],
  "If Google cannot crawl a page, nothing else you do to that page matters."],
 ["indexing","Rendering and indexing","After crawling, Google renders the page like a browser, works out what it is about and may store it in its index, the database it searches when someone types a query.",
  ["Not every crawled page is indexed. Duplicates, thin pages and blocked pages are often left out.","A `noindex` tag asks Google to keep a page out of the index.","Content that only appears after JavaScript runs can be indexed late or missed.","Check any page's status with the URL Inspection tool in Search Console."],
  "Crawled is not indexed, and indexed is not ranking."],
 ["ranking","Ranking","When someone searches, Google picks matching pages from its index and orders them using many signals. Nobody outside Google knows the full list or the weights.",
  ["Core ideas: relevance to the query, content quality, links from other sites, usability, and context such as location, language and device.","Each page competes on its own, but overall site quality and reputation also influence results.","Rankings move often and differ by user, so think in ranges, not fixed spots.","Serving the searcher well beats chasing single factors."],
  "Ranking is a comparison: your page against every other page that could answer the query."],
 ["serp","The SERP","The search engine results page is more than ten blue links. It mixes organic results with ads, maps, images, videos, featured snippets, People Also Ask boxes and AI-generated answers.",
  ["The layout changes by query type, so look at the real SERP before planning content.","Features such as snippets and AI answers can satisfy a query without a click.","Ads are labelled and sit above or below organic results.","Aim for the features that suit your page type, not only position 1."],
  "Search the keyword yourself first. The SERP shows what Google thinks the user wants."],
 ["seo-types","The four areas of SEO","SEO work falls into four connected areas.",
  ["On-page: the content and HTML of each page, such as titles, headings, copy and internal links.","Technical: crawlability, indexing, speed, mobile support and site structure.","Off-page: signals from outside your site, mainly backlinks and brand mentions.","Content: deciding which topics to cover and how. Local SEO is a specialised branch for location-based searches."],
  "Great content on a site Google cannot crawl earns nothing, and a perfect site with weak content earns nothing either."],
 ["search-intent","Search intent","Intent is the reason behind a search. Google ranks pages that satisfy that reason, so matching intent matters more than repeating a keyword.",
  ["Informational: the person wants to learn (“what is SEO”).","Navigational: they want a specific site (“Search Console login”).","Commercial: they are comparing options (“best SEO tools”).","Transactional: they are ready to act or buy (“buy domain name”).","Read page one to see which format wins: guide, list, product page or tool."],
  "The right content in the wrong format for the intent will not rank."],
 ["helpful-content","Helpful content and E-E-A-T","Google's systems aim to reward content made to help people, not to rank. E-E-A-T (experience, expertise, authoritativeness, trust) is the framework quality raters use to judge it.",
  ["Experience is first-hand use. Expertise is real knowledge. Authoritativeness is recognition in the field. Trust is accuracy, honesty and safety.","Trust is the most important of the four.","Show it with author names and bios, sources, original examples and clear contact details.","E-E-A-T is not a single ranking score. It guides how quality is assessed.","Standards are stricter for health, money and safety topics (called YMYL)."],
  "Write what you would want to read if you had this question."],
 ["spam-policies","Spam policies and white hat SEO","Google publishes spam policies. Breaking them can cause demotion or removal from results. White hat SEO follows them. Black hat SEO tries to get around them.",
  ["Common violations: keyword stuffing, cloaking, hidden text, link schemes, scraped content and mass-produced low-value pages.","Newer targets include scaled content abuse, site reputation abuse and expired domain abuse.","Actions can be algorithmic (automatic) or manual (shown in Search Console).","Shortcuts may work briefly and then fail badly."],
  "If you would hide a tactic from Google, do not use it."],
 ["algorithm-updates","Algorithm updates","Google changes its ranking systems constantly. A few times a year it announces broad core updates that can reshuffle results.",
  ["A core update reassesses quality across the web. It is not a penalty.","After a drop, compare the pages that fell with those that gained, then improve quality.","Follow the Google Search Status Dashboard and the Search Central blog for official notices.","Wait for the rollout to finish before analysing. Hurried changes mid-update confuse the picture."],
  "Sites built on real usefulness survive updates better than sites built on loopholes."]
 ]},
{n:2,t:"Tools and data",w:"Weeks 3-5",tone:"a",
 goal:"Read your site's data and find problems using free tools.",
 task:"Build a baseline report for your practice site: clicks, impressions, top pages, indexed pages and the top 10 issues from a crawl.",
 topics:[
 ["gsc-setup","Google Search Console","Search Console is Google's free tool that shows how your site appears in Search: which queries bring impressions, which pages are indexed and what errors exist.",
  ["Add your site as a Domain property, verified through DNS, to cover every URL version.","Data covers roughly the last 16 months.","It reports Google data only, not other search engines.","Check it weekly. It also emails alerts about serious problems."],
  "Search Console is the most trustworthy SEO data source because it comes from Google itself."],
 ["gsc-performance","The Performance report","The Performance report shows how your site does in Google results, split by query, page, country and device.",
  ["Clicks are visits from Google. Impressions are the times a result was shown.","CTR is clicks divided by impressions. Average position is the mean ranking spot.","High impressions with low CTR usually means a weak title or description.","Pages at positions 8 to 20 with decent impressions are quick-win candidates.","Compare date ranges to see trends."],
  "Filter by page or query to turn raw numbers into actions."],
 ["gsc-indexing","Indexing reports and URL Inspection","The Pages report lists which URLs are indexed and why others are not. URL Inspection checks a single page in detail.",
  ["Common reasons: “Crawled, currently not indexed”, “Discovered, currently not indexed”, duplicate, blocked by robots.txt, noindex.","URL Inspection shows the indexed version, the canonical Google chose and the rendered page.","You can request indexing for a new or updated page. It is a request, not a guarantee.","The Sitemaps report confirms Google can read your submitted sitemap."],
  "Diagnose why a page is not indexed before trying to fix it."],
 ["ga4-basics","Google Analytics 4 basics","GA4 measures what visitors do after they arrive. It is event-based: page views, clicks, scrolls and purchases are all events.",
  ["Users are people, sessions are visits.","An engaged session lasts over 10 seconds, has a key event, or has 2 or more page views.","Engagement rate replaced bounce rate as the main quality signal.","Acquisition reports show where traffic comes from. Filter for Organic Search.","Install GA4 with Google Tag Manager or a plugin and confirm it in the Realtime report."],
  "Search Console shows how people find you. GA4 shows what they do next."],
 ["ga4-conversions","Conversions in GA4","A conversion, called a key event in GA4, is an action that matters to the business, such as a form submission, call click or purchase.",
  ["Mark chosen events as key events in GA4.","Track forms, phone and WhatsApp clicks and booking buttons.","View organic conversions under Reports, Acquisition, Traffic acquisition.","Without conversion tracking you cannot prove SEO is working."],
  "Traffic is a vanity number until it is tied to a business action."],
 ["screaming-frog","Screaming Frog SEO Spider","A desktop crawler that visits your site the way a search engine does and lists every URL with its title, headings, status code and links.",
  ["The free version crawls up to 500 URLs.","Use it to find broken links, redirect chains, missing titles, duplicate content and noindex pages.","Export the tabs to a spreadsheet and sort by problem type.","Connect it to Search Console or PageSpeed Insights for richer data."],
  "A crawl turns “something feels wrong” into a precise list of URLs to fix."],
 ["pagespeed","PageSpeed Insights and Lighthouse","Both test page performance. PageSpeed Insights shows real-user data from Chrome plus a lab test. Lighthouse is the lab tool built into Chrome DevTools.",
  ["Field data (the Core Web Vitals assessment) is what counts for Google. Lab data helps debug.","Test key templates such as home, category and post, not every URL.","Mobile results matter more than desktop.","Treat the opportunities list as hints, not orders."],
  "Fix what real users experience, not just the score."],
 ["keyword-tools","Keyword and SEO tools","Freemium and paid tools estimate keyword volume, difficulty and competitor strength. Their numbers are estimates and differ between tools.",
  ["Google Keyword Planner and Google Trends are free and come from Google.","Ahrefs, Semrush and Ubersuggest add keyword, competitor and backlink analysis.","Ahrefs Webmaster Tools is free for sites you own.","Learn one tool well before adding more."],
  "Tools suggest. Your judgement and Search Console data decide."],
 ["reporting-tools","Looker Studio and dashboards","Looker Studio is a free dashboard builder that connects to Search Console and GA4 so reports update on their own.",
  ["Start with five numbers: organic clicks, impressions, average position, organic sessions and conversions.","Add month-over-month and year-over-year comparisons.","Write a short summary of what changed and what to do next.","Keep it simple enough for a non-expert to read in two minutes."],
  "A report is only useful if it ends in a decision."]
 ]},
{n:3,t:"Keywords and content",w:"Weeks 5-9",tone:"a",
 goal:"Choose what to write about and structure a site around topics.",
 task:"Create a keyword map for 20 pages, then publish three optimised articles on your practice site.",
 topics:[
 ["keyword-types","Keyword types","Keywords are grouped by length, role and intent.",
  ["Short-tail (1 to 2 words): high volume, vague intent, hard to rank for.","Long-tail (3 or more words): lower volume, clearer intent, easier to rank and often converts better.","Primary keyword: the main target of a page. Secondary keywords: related terms the page also covers.","Branded keywords include your name. Non-branded ones are how new people find you."],
  "Beginners win with long-tail keywords."],
 ["keyword-metrics","Keyword metrics","Metrics help you compare keyword opportunities.",
  ["Search volume: estimated monthly searches.","Keyword difficulty (KD): a tool-specific score of how hard it is to rank, based mostly on backlinks.","CPC: what advertisers pay per click, a hint of commercial value.","Traffic potential: the total traffic the top page gets, often more useful than volume.","Relevance and intent come before any number."],
  "A low-volume keyword that fits your business beats a high-volume one that does not."],
 ["keyword-process","The keyword research process","A repeatable way to build a keyword list.",
  ["List your products, services and customer questions as seed topics.","Expand with a keyword tool, Google Suggest, People Also Ask and related searches.","Check each SERP for intent and competition.","Mine Search Console for queries you almost rank for already.","Record everything in a sheet: keyword, volume, difficulty, intent, target page."],
  "Start from real customer language, not only tool suggestions."],
 ["keyword-mapping","Clustering and mapping","Clustering groups keywords that share an intent. Mapping assigns each cluster to one page.",
  ["If the same pages rank for two keywords, they probably belong on one page.","One page, one main intent. Two pages chasing the same query is called cannibalisation.","Each mapped page gets a primary keyword plus secondary keywords.","Keep the map in a spreadsheet and update it as the site grows."],
  "A keyword map prevents overlap and reveals which pages are missing."],
 ["competitor-research","Competitor research","Your SEO competitors are the sites that rank for your keywords. They may differ from your business competitors.",
  ["Search your main keywords and note which domains keep appearing.","Use a tool to see their top pages and keywords.","Study the format, depth and angle of their best pages.","Look for gaps where they are weak or thin."],
  "Learn from what ranks, then be more useful, not just longer."],
 ["topic-clusters","Topic clusters and pillar pages","A pillar page covers a broad topic. Cluster pages cover subtopics in depth. All of them link to each other.",
  ["It builds topical authority: proof you cover a subject thoroughly.","Cluster pages link up to the pillar and across to related pages.","Plan clusters around the questions customers ask at each stage of buying.","Start with one pillar and five to eight supporting pages."],
  "Depth on a few topics beats shallow coverage of many."],
 ["content-gap","Content gap analysis","A content gap is a topic competitors rank for and you do not, or a question searchers ask that nobody answers well.",
  ["Use a tool's gap feature to compare your domain with two or three competitors.","Check People Also Ask and forums for unanswered questions.","Review your own pages for outdated or missing sections.","Prioritise gaps by relevance to your business and ease."],
  "Fill the gaps that connect to real customer needs first."],
 ["content-writing","Writing and briefing SEO content","A content brief tells a writer what a page must achieve before writing starts.",
  ["A brief includes: target keyword, intent, audience, outline of H2s, questions to answer, internal links and sources.","Answer the main question early, then add depth.","Add original value: examples, data, screenshots, expert input.","Use short paragraphs, descriptive headings and plain language.","AI can help draft, but a human must check facts and add real experience."],
  "Cover the topic better than the current top results, not just at greater length."],
 ["content-refresh","Updating existing content","Refreshing old pages is often faster and cheaper than writing new ones.",
  ["Find pages whose clicks or rankings are falling in Search Console.","Update facts, add missing sections, fix links and improve the title.","Keep the same URL unless there is a strong reason to change it.","Request indexing again after major updates."],
  "Review your best pages every 6 to 12 months."]
 ]},
{n:4,t:"On-page SEO",w:"Weeks 9-12",tone:"b",
 goal:"Optimise individual pages so search engines and visitors understand them quickly.",
 task:"Optimise your 10 most important pages, then track their clicks and positions in Search Console for four weeks.",
 topics:[
 ["title-tags","Title tags","The title tag is the clickable headline in search results and a strong relevance signal.",
  ["Aim for about 50 to 60 characters so it is not cut off.","Put the main keyword near the start and write for humans.","Make every title unique across the site.","Google may rewrite titles that are stuffed or vague."],
  "A good title earns the click as well as the ranking."],
 ["meta-descriptions","Meta descriptions","The meta description is the summary shown under the title. It is not a direct ranking factor, but it influences clicks.",
  ["Aim for about 150 to 160 characters.","Describe the benefit and give a clear reason to click.","Include the keyword. Google bolds matching words.","Google often rewrites descriptions to match the query."],
  "Think of it as a tiny advertisement for the page."],
 ["headings","Heading structure","Headings (H1 to H6) organise a page and help users and search engines scan it.",
  ["Use one H1 that states the page topic.","H2s mark main sections and H3s mark subsections. Do not skip levels for styling.","Use natural keywords and real questions in headings.","Good headings also improve accessibility."],
  "If the headings alone tell the story, the page is well structured."],
 ["urls","URL structure","A good URL is short, readable and describes the page.",
  ["Use lowercase words separated by hyphens.","Include the main keyword and drop filler words and dates.","Avoid parameters and long number strings on content pages.","Never change a live URL without a 301 redirect."],
  "Choose URLs you will not need to change."],
 ["keyword-placement","Keyword placement","Place the primary keyword where it naturally signals the topic, without forcing it.",
  ["Good spots: title, H1, first 100 words, URL and at least one subheading.","Use synonyms and related terms instead of repeating the exact phrase.","Image alt text and the meta description are secondary spots.","There is no ideal keyword density, and stuffing hurts."],
  "If it sounds unnatural read aloud, rewrite it."],
 ["internal-linking","Internal linking","Internal links connect your own pages. They help crawlers find content and spread authority around the site.",
  ["Use descriptive anchor text, not “click here”.","Link from strong pages to important or new pages.","Keep every important page within three clicks of the homepage.","Fix orphan pages, which have no internal links pointing to them.","Add contextual links in body copy, not just in menus."],
  "Internal links are the cheapest and most controllable ranking lever you have."],
 ["image-seo","Image SEO","Optimised images load fast, can appear in image search and support accessibility.",
  ["Use descriptive file names such as `red-running-shoes.jpg`.","Write alt text that describes the image for someone who cannot see it.","Compress images and use modern formats like WebP or AVIF.","Set width and height to prevent layout shift, and lazy-load images below the fold."],
  "Alt text is for people first and search engines second."],
 ["on-page-content","Optimising page content","Content optimisation means making the page the best answer to its target query.",
  ["Match the intent and format of the top results.","Cover the subtopics and questions searchers expect, using the SERP and People Also Ask as a guide.","Add a clear call to action and trust signals such as author, reviews and contact details.","Use lists, tables and short definitions that can be lifted into snippets or AI answers.","Check results in Search Console after a few weeks."],
  "Optimise for the reader's next step, not for a tool's score."]
 ]},
{n:5,t:"Technical SEO and speed",w:"Weeks 12-17",tone:"b",
 goal:"Make sure Google can crawl, render and index the site, and that pages load fast on phones.",
 task:"Run a full crawl, list every issue, rank them by impact and fix the top 10.",
 topics:[
 ["site-architecture","Site architecture","Architecture is how pages are organised and linked. A clear structure helps crawling and shows which pages matter most.",
  ["Keep it flat: key pages within three clicks of the homepage.","Group content into logical categories with consistent URLs.","Use breadcrumbs to show the hierarchy.","Navigation should reflect the pages you most want to rank."],
  "Design the site so a new visitor and Googlebot both find things easily."],
 ["sitemaps","XML sitemaps","An XML sitemap lists the URLs you want indexed. You submit it through Search Console.",
  ["Include only indexable, canonical URLs that return status 200.","Large sites can split into several sitemaps under one index file.","Yoast and similar WordPress plugins generate it automatically.","A sitemap helps discovery but does not guarantee indexing."],
  "A clean sitemap tells Google which URLs you consider important."],
 ["robots","Robots.txt and meta robots","`robots.txt` controls what crawlers may fetch. Meta robots tags control what may be indexed.",
  ["Robots.txt blocks crawling. It does not reliably remove a page from search.","Use `noindex` (a meta robots tag or X-Robots-Tag header) to keep a page out of the index.","Do not block a page in robots.txt if Google needs to see its noindex tag.","Never block CSS or JS files needed for rendering.","A stray `Disallow: /` can block an entire site from crawling."],
  "Crawl rules and index rules are different tools. Use the right one."],
 ["status-codes","HTTP status codes","Every request returns a status code that tells browsers and crawlers what happened.",
  ["200 means OK. 301 is a permanent redirect. 302 is a temporary redirect.","404 means not found. 410 means permanently gone.","5xx codes are server errors, and repeated ones reduce crawling.","A broken page should return 404, not a normal page saying “not found”. That is a soft 404."],
  "Status codes are how your server talks to Google. Make sure they tell the truth."],
 ["redirects","Redirects","A redirect sends visitors and crawlers from one URL to another.",
  ["Use a 301 when a page moves permanently.","Avoid chains (A to B to C) and loops.","Redirect to the most relevant page, not always the homepage.","Update internal links to point straight to the final URL."],
  "Every URL change needs a plan for the old address."],
 ["duplicates","Duplicate content and canonicals","Duplicate or near-duplicate pages split signals. A canonical tag tells Google which version you prefer.",
  ["Common causes: www vs non-www, http vs https, URL parameters, tag pages and printer versions.","`rel=\"canonical\"` points to the preferred URL. It is a hint, not a command.","Most pages should canonicalise to themselves.","Fix at the source with redirects where possible."],
  "Pick one URL per piece of content and use it consistently."],
 ["mobile-js","Mobile and JavaScript SEO","Google indexes the mobile version of a page first. JavaScript-heavy sites need extra care so crawlers can see the content.",
  ["Mobile and desktop versions should carry the same content and links.","Text must be readable without zooming and tap targets well spaced.","Important content and links should be in the rendered HTML, not only loaded after a user action.","Use URL Inspection to compare the rendered page with what you expect."],
  "Test on a real phone. It is how most people, and Google, see your site."],
 ["schema","Structured data (schema markup)","Structured data is code, usually JSON-LD, that labels page content so search engines understand it precisely and may show rich results.",
  ["Common types: Organization, LocalBusiness, Article, Product, FAQ and BreadcrumbList.","Markup must match what is visible on the page.","Validate with Google's Rich Results Test and the Schema.org validator.","Schema does not directly boost rankings. It improves clarity and eligibility for rich results.","Google has limited some rich results, such as FAQ. Check current eligibility first."],
  "Mark up what is really on the page and nothing more."],
 ["core-web-vitals","Core Web Vitals","Three metrics measure real user experience.",
  ["LCP (Largest Contentful Paint) measures loading. Good is 2.5 seconds or less.","INP (Interaction to Next Paint) measures responsiveness. Good is 200 milliseconds or less.","CLS (Cumulative Layout Shift) measures visual stability. Good is 0.1 or less.","They are judged at the 75th percentile of real visits, for mobile and desktop separately.","They are a small ranking signal but a big user-experience factor."],
  "Fast, stable pages help both rankings and conversions."],
 ["speed-fixes","Page speed fixes","Most speed problems come from a short list of causes.",
  ["Compress and correctly size images. Serve WebP or AVIF.","Use caching, a CDN and a good host.","Minify CSS and JS and remove unused plugins and scripts.","Delay third-party scripts and preload the main hero image.","Reserve space for images and ads to prevent layout shift.","On WordPress, heavy page builders and plugin bloat are frequent culprits."],
  "Measure, change one thing, measure again."]
 ]},
{n:6,t:"Off-page and local SEO",w:"Weeks 17-21",tone:"b",
 goal:"Earn trust from other sites and win nearby searches.",
 task:"Build a 20-target link plan and a complete Google Business Profile checklist for a real or practice business.",
 topics:[
 ["backlinks","Backlinks","A backlink is a link from another website to yours. Google treats good links as signals of trust.",
  ["Referring domains (unique sites linking to you) matter more than raw link count.","Links from relevant, reputable sites carry the most value.","Normal links pass signals. The `nofollow`, `sponsored` and `ugc` attributes tell Google how to treat a link.","Links take time, so aim for steady growth."],
  "One link from a respected, relevant site beats a hundred from junk."],
 ["link-quality","Link quality and anchor text","Not all links are equal. Value depends on relevance, authority, placement and how natural the link looks.",
  ["Good signs: topical relevance, real traffic, editorial placement inside content.","Anchor text is the clickable words. A natural mix of brand, URL, generic and keyword-related anchors looks healthy.","Repeating the same exact-match anchor looks manipulative.","Check a prospect's site: does it have real content and a real audience?"],
  "Ask: would this link exist if search engines did not?"],
 ["link-building","Link building methods","Ways to earn links ethically.",
  ["Create useful assets: original data, tools, guides and templates.","Offer guest contributions on relevant sites that give their readers real value.","Digital PR: newsworthy stories and expert comments that journalists use.","Broken-link and unlinked-mention outreach.","Partner, supplier and business profile pages.","Never buy links or join large-scale link exchanges."],
  "Create something worth linking to first, then tell people about it."],
 ["brand-mentions","Brand mentions and digital PR","Mentions of your brand, with or without a link, build awareness and signal that you are a real entity.",
  ["Monitor mentions with alerts and ask for a link where one is missing.","Get quoted as an expert in industry publications, podcasts and news.","Consistent branding across the web helps search engines connect the dots.","AI search tools tend to cite brands that are widely mentioned."],
  "Being talked about is the foundation of being linked to."],
 ["link-spam","Toxic links and link spam","Spammy or paid links can lead to devalued links or manual actions.",
  ["Google mostly ignores low-quality links automatically.","Risk signs: link farms, hacked sites, irrelevant foreign sites with exact-match anchors, paid links without a `sponsored` attribute.","Audit links in the Search Console Links report and a backlink tool.","Disavow only for a clear manual action or large-scale spam you cannot get removed."],
  "Prevention beats cleanup. Do not build links you would later need to disavow."],
 ["local-seo","Local SEO basics","Local SEO helps a business appear for nearby searches such as “dentist near me” in the map pack and local organic results.",
  ["Three main factors: relevance, distance and prominence.","It suits businesses with a physical location or a service area.","Local results draw mainly on Google Business Profile plus website signals.","Track rankings by location, not as one global position."],
  "Local searchers are often ready to visit or call, so conversion is high."],
 ["gbp","Google Business Profile","Your free listing on Google Search and Maps.",
  ["Verify ownership and choose the most accurate primary category.","Complete every field: name, address, phone, hours, services, description and photos.","Post updates and answer questions regularly.","Use your real business name only. Stuffing keywords in it can get the profile suspended.","Link to the most relevant landing page."],
  "A complete, active profile is the biggest local ranking lever you control."],
 ["nap-citations","NAP and citations","NAP is Name, Address, Phone number. A citation is any online mention of them.",
  ["Keep NAP identical everywhere: website, profile, directories and social accounts.","Prioritise major platforms and relevant industry or local directories.","Fix duplicate and outdated listings.","Consistency builds trust. Quantity matters less."],
  "Inconsistent details confuse both Google and customers."],
 ["reviews","Customer reviews","Reviews influence rankings and strongly influence whether people choose you.",
  ["Ask every happy customer, with a direct review link.","Reply to all reviews, good and bad, politely.","Never buy, fake or gate reviews. It violates policy.","Recent reviews that mention your services help relevance."],
  "Reviews are social proof that Google can measure and customers can see."],
 ["local-pages","Local landing pages and schema","Dedicated pages for each location or service area, supported by LocalBusiness schema.",
  ["Create one unique page per location with local details, not copied text.","Include address, map, hours, local photos, testimonials and FAQs.","Add LocalBusiness structured data that matches the page.","Do not make near-identical pages for dozens of towns. That is doorway spam."],
  "Make each location page genuinely useful to someone in that place."]
 ]},
{n:7,t:"Advanced and AI search",w:"Weeks 21-26",tone:"b",
 goal:"Handle AI search, major site changes and full audits like a professional.",
 task:"Final project: audit one real site, write a 3-month plan, carry it out and report the before-and-after results.",
 topics:[
 ["ai-overviews","AI Overviews and AI Mode","Google now shows AI-generated answers in AI Overviews and AI Mode, with links to supporting sources.",
  ["Google says the same SEO fundamentals apply. No special markup is required.","A page must be indexed and eligible to show a snippet to be used as a supporting link.","Clear, factual, well-structured content is easier to cite.","Clicks on some informational queries may fall, so also track visibility, brand searches and conversions.","Google includes this traffic in Search Console performance data."],
  "Be the source worth citing."],
 ["geo-aeo","GEO and AEO","Generative Engine Optimisation and Answer Engine Optimisation aim to get your brand and content cited in AI tools such as ChatGPT, Perplexity, Gemini and Claude, as well as Google.",
  ["Give a direct answer in the first lines, then add depth.","Use clear headings, short definitions, lists and tables.","Include original data, expert input and verifiable sources.","Keep brand, author and fact details consistent across the web.","Allow reputable AI crawlers in robots.txt if you want visibility, and track AI referral traffic in GA4.","It builds on SEO. It does not replace it."],
  "Good SEO plus clear, citable answers is the best practice today."],
 ["entity-seo","Entity SEO","An entity is a clearly defined thing, such as a person, brand, place or concept, that search engines can recognise. Entity SEO helps them understand who you are and what you are known for.",
  ["Use consistent names and descriptions everywhere.","Add Organization or Person schema with `sameAs` links to your official profiles.","Build a strong About page, author pages and verified social profiles.","Get mentioned alongside related topics and entities."],
  "Make it easy for machines to know exactly who you are."],
 ["migrations","Site migrations","A migration is a major change such as a redesign, domain change, HTTPS move or CMS switch. Handled badly, it can wipe out traffic.",
  ["Before launch, crawl the old site and save all URLs, rankings and traffic data.","Map every old URL to its new equivalent with 301 redirects.","Test on a staging site that is blocked from indexing, and make sure the live site is indexable.","After launch, submit the sitemap, watch for errors and compare traffic weekly.","For domain changes, use the Change of Address tool in Search Console."],
  "Plan the redirect map before the design is final."],
 ["traffic-drops","Diagnosing traffic drops","A systematic checklist for finding why organic traffic fell.",
  ["Confirm it is real: compare GA4 and Search Console and check tracking.","Pin down the date and scope: sitewide, one section or a few pages.","Check technical causes: robots.txt, noindex, redirects, server errors, a recent migration.","Check for Google updates and manual actions.","Review SERP changes, competitors and seasonality.","Fix the cause, then monitor recovery over several weeks."],
  "Diagnose before you act. Random changes make things worse."],
 ["international","International SEO","Targeting several countries or languages.",
  ["Use separate URLs per language or country. Subfolders are the simplest option.","Add `hreflang` tags so Google serves the right version.","Translate and localise: currency, examples and search terms.","Do not redirect users automatically based only on location."],
  "Treat each market's search behaviour as its own research project."],
 ["programmatic","Programmatic SEO","Generating many pages from a template and a database, such as “plumber in [city]” or “[tool] vs [tool]”.",
  ["It works when each page carries unique, useful data.","Mass-producing thin or near-duplicate pages breaks spam policies (scaled content abuse).","Start small, check indexing and engagement, then scale."],
  "Scale value, not just page count."],
 ["ecommerce","Ecommerce SEO","SEO for online stores focuses on category pages, product pages and managing very large numbers of URLs.",
  ["Optimise category pages first. They target high-volume commercial terms.","Write unique product descriptions and add reviews and Product schema.","Control faceted navigation and filters to avoid duplicates and wasted crawling.","Handle out-of-stock items deliberately: keep, redirect or remove, depending on the case."],
  "Category pages usually bring more search traffic than product pages."],
 ["audit-process","The SEO audit process","An audit reviews a site for problems and opportunities, then ranks them by impact.",
  ["Technical: crawl, indexing, speed, mobile and structured data.","On-page and content: titles, thin or duplicate pages, intent match and gaps.","Off-page: backlink profile and competitors.","Prioritise by impact and effort. Fix high-impact, low-effort items first.","End with a roadmap: what, who and when."],
  "An audit without priorities is just a list of complaints."],
 ["seo-reporting","Monthly SEO reporting","A regular report shows progress against goals and what to do next.",
  ["Include organic clicks and impressions, key rankings, organic conversions, top pages and work completed.","Compare with last month and the same month last year.","Explain causes in plain language and list next month's actions.","Tie results to business goals such as leads or revenue."],
  "Report outcomes first and activities second."]
 ]}
];
